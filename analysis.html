      series = cols.concat(['__o']).map(function(ck, i) {
        return {
          name: ck === '__o' ? '其他' : d2.disp(ck), type: 'bar', stack: 'total', barMaxWidth: 26,
          itemStyle: { color: ck === '__o' ? '#c3cad4' : (S.STATUS_COLOR[ck] || PAL[i % PAL.length]) },
          emphasis: { focus: 'series' },
          data: groups.map(function(g) {
            var sub = g.rows.filter(function(r) {
              var k = d2.key(r);
              return ck === '__o' ? cols.indexOf(k) < 0 : k === ck;
            });
            var v = metricOf({ cap: S.sumCap(sub) / 1000, units: sub.length,
              plants: Object.keys(sub.reduce(function(m, r) { m[r[0]] = 1; return m; }, {})).length }, card.metric);
            return +v.toFixed(2);
          })
        };
      });
    } else {
      series = [{ type: 'bar', barMaxWidth: 26,
        data: groups.map(function(g) {
          var c = card.dim === 'status' ? (S.STATUS_COLOR[g.key] || '#0e7c6f') : '#0e7c6f';
          return { value: +metricOf(g, card.metric).toFixed(2), itemStyle: { color: c, borderRadius: [4, 4, 0, 0] } };
        }) }];
    }
    return { chart: 'bar_v', opt: {
      animation: false,
      tooltip: Object.assign(tip, { trigger: 'axis', axisPointer: { type: 'shadow' } }),
      legend: card.dim2 ? { top: 0, textStyle: { color: '#6b7688', fontSize: 11 }, itemWidth: 12, itemHeight: 8, type: 'scroll' } : undefined,
      grid: { left: 62, right: 20, top: card.dim2 ? 40 : 24, bottom: labelRot ? 64 : 40 },
      dataZoom: cats.length > 16 ? [{ type: 'slider', height: 16, bottom: 4 }] : undefined,
      xAxis: { type: 'category', data: cats, axisLabel: { color: '#6b7688', fontSize: 10, interval: 0, rotate: labelRot }, axisLine: S.EC.axisLine, axisTick: { show: false } },
      yAxis: { type: 'value', axisLabel: S.EC.axisLabel, splitLine: S.EC.splitLine },
      series: series
    }};
  }

  /* ================= 卡片渲染 ================= */
  function cardTitle(card) {
    var t = '按' + DIMS[card.dim].label + ' · ' + METRICS[card.metric].label;
    if (card.dim2 && ['stack', 'heatmap'].indexOf(resolvedChart(card)) >= 0) t += ' × ' + DIMS[card.dim2].label;
    return t;
  }
  function resolvedChart(card) {
    return card.chart === 'auto' ? (card.dim === 'year' || card.dim === 'decade' ? 'line' : 'bar_v') : card.chart;
  }

  function renderCards() {
    var grid = document.getElementById('cards-grid');
    if (!cards.length) {
      grid.innerHTML = '<div class="canvas-empty" style="grid-column:1/-1">画布是空的——从左侧<b>模板库</b>一键载入，或在「新建分析卡片」里选好维度和指标后点「添加到画布」。</div>';
      return;
    }
    grid.innerHTML = '';
    cards.forEach(function(card) {
      var el = document.createElement('div');
      el.className = 'ana-card' + (card.full ? ' full' : '');
      el.innerHTML =
        '<div class="ac-head"><div class="ac-title"><h3>' + S.esc(cardTitle(card)) + '</h3><div class="ac-sub"></div></div>' +
        '<div class="ac-btns">' +
        '<button class="icon-btn" data-act="full" title="放大/还原">⛶</button>' +
        '<button class="icon-btn" data-act="copy" title="复制卡片">⧉</button>' +
        '<button class="icon-btn" data-act="png" title="导出 PNG">⤓</button>' +
        '<button class="icon-btn" data-act="csv" title="导出聚合 CSV">▤</button>' +
        '<button class="icon-btn danger" data-act="del" title="删除">✕</button>' +
        '</div></div>' +
        '<div class="ac-bc"></div>' +
        '<div class="ac-chart"></div>';
      grid.appendChild(el);
      renderCardContent(card, el);
      el.querySelectorAll('.icon-btn').forEach(function(b) {
        b.addEventListener('click', function() { cardAction(b.getAttribute('data-act'), card); });
      });
    });
  }

  function renderCardContent(card, el) {
    var rows = cardRows(card);
    card._rows = rows;
    var groups = aggregate(rows, card.dim, card.topn != null ? card.topn : G.topn);
    var sub = el.querySelector('.ac-sub');
    var bcEl = el.querySelector('.ac-bc');
    var chartEl = el.querySelector('.ac-chart');

    var stats = cardStats(groups, card.metric);
    var drillTxt = card.drill.length ? '下钻：' + card.drill.map(function(f) { return DIMS[f.dim].disp(f.value); }).join(' › ') + ' · ' : '';
    sub.textContent = drillTxt + groups.length + ' 组 · ' + rows.length.toLocaleString() + ' 台机组 · CR3 ' + stats.cr3.toFixed(0) + '% · CR10 ' + stats.cr10.toFixed(0) + '% · HHI ' + stats.hhi;

    // 面包屑
    if (card.drill.length) {
      bcEl.style.display = 'flex';
      var html = '<button class="bc-seg" data-i="-1">全部</button>';
      card.drill.forEach(function(f, i) {
        html += '<span class="bc-sep">›</span><button class="bc-seg" data-i="' + i + '">' + S.esc(DIMS[f.dim].disp(f.value)) + '</button>';
      });
      bcEl.innerHTML = html;
      bcEl.querySelectorAll('.bc-seg').forEach(function(b) {
        b.addEventListener('click', function() {
          var i = +b.getAttribute('data-i');
          if (i < 0) { card.drill = []; card.dim = card.drill0 || card.dim; }
          else { card.dim = card.drill[i].dim; card.drill = card.drill.slice(0, i + 1); }
          refreshCard(card);
        });
      });
    } else { bcEl.style.display = 'none'; bcEl.innerHTML = ''; }

    if (!groups.length) {
      chartEl.outerHTML = '<div class="ac-empty">当前筛选无匹配数据</div>';
      delete chartMap[card.id];
      return;
    }
    var built = buildOption(card, groups);
    card._builtChart = built.chart;
    if (chartMap[card.id]) { chartMap[card.id].dispose(); }
    var inst = echarts.init(chartEl);
    inst.setOption(built.opt, { notMerge: true });
    chartMap[card.id] = inst;

    inst.on('click', function(p) {
      if (built.chart === 'heatmap') {
        var cols = card._hmCols;
        if (!p.value || !p.value.length) return;
        var col = cols[p.value[0]], rowGroup = groups[p.value[1]];
        if (!col || !rowGroup) return;
        openCtx(p.event.offsetX + chartEl.getBoundingClientRect().left, p.event.offsetY + chartEl.getBoundingClientRect().top, [
          { label: '查看「' + rowGroup.disp + ' × ' + col.disp + '」明细', fn: function() {
            openDetail(rowGroup.disp + ' × ' + col.disp, [{ dim: card.dim, value: rowGroup.key === '__other' ? null : rowGroup.key }, { dim: col.dimKey, value: col.key }].filter(function(f) { return f.value !== null; }));
          } },
          gFilterItem(card.dim, rowGroup),
          gFilterItem(col.dimKey, { key: col.key, disp: col.disp })
        ]);
        return;
      }
      var g = groups.filter(function(x) { return x.disp === p.name; })[0];
      if (!g) return;
      var items = [];
      var drillDims = ['status', 'fuel', 'region', 'decade', 'capbin', 'owner', 'country'].filter(function(dk) { return dk !== card.dim; }).slice(0, 5);
      if (g.key !== '__other') {
        drillDims.forEach(function(dk) {
          items.push({ label: '下钻 → 按' + DIMS[dk].label + '看「' + g.disp + '」', fn: function() {
            card.drill0 = card.drill0 || card.dim;
            card.drill.push({ dim: card.dim, value: g.key });
            card.dim = dk;
            refreshCard(card);
          } });
        });
        items.push({ label: '查看「' + g.disp + '」明细记录', fn: function() {
          openDetail(g.disp, [{ dim: card.dim, value: g.key }]);
        } });
        var gf = gFilterItem(card.dim, g);
        if (gf) items.push(gf);
      } else {
        items.push({ label: '查看「其他」明细记录', fn: function() { openDetail('其他', null, g.rows); } });
      }
      var rect = chartEl.getBoundingClientRect();
      openCtx(p.event.clientX || (rect.left + p.event.offsetX), p.event.clientY || (rect.top + p.event.offsetY), items);
    });
  }

  function gFilterItem(dimKey, g) {
    if (g.key === '__other' || !GLOBAL_DIM[dimKey]) return null;
    return { label: '设为全局筛选：' + DIMS[dimKey].label + ' = ' + g.disp, fn: function() {
      var gd = GLOBAL_DIM[dimKey];
      if (gd === 'status') { G.status = [g.key]; renderStatusChips(); }
      else { G[gd] = g.key; var sel = document.getElementById('g-' + (gd === 'country' ? 'country' : gd)); if (sel && sel.tagName === 'SELECT') sel.value = g.key; else if (gd === 'country') document.getElementById('g-country').value = g.key; }
      toast('已应用全局筛选');
      refreshAll();
    } };
  }

  function refreshCard(card) {
    var els = document.querySelectorAll('.ana-card');
    var idx = cards.indexOf(card);
    if (idx >= 0 && els[idx]) renderCardContent(card, els[idx]);
    else refreshAll();
  }

  function cardAction(act, card) {
    if (act === 'del') { cards.splice(cards.indexOf(card), 1); if (chartMap[card.id]) { chartMap[card.id].dispose(); delete chartMap[card.id]; } renderCards(); persistLast(); }
    if (act === 'full') { card.full = !card.full; renderCards(); persistLast(); }
    if (act === 'copy') { var c = JSON.parse(JSON.stringify({ dim: card.dim, metric: card.metric, chart: card.chart, dim2: card.dim2, topn: card.topn, drill: card.drill, full: card.full })); c.id = uid++; cards.splice(cards.indexOf(card) + 1, 0, c); renderCards(); persistLast(); toast('已复制卡片'); }
    if (act === 'png') {
      var inst = chartMap[card.id];
      if (!inst) return;
      var a = document.createElement('a');
      a.href = inst.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' });
      a.download = cardTitle(card).replace(/[\\/:*?"<>|·]/g, '-') + '.png';
      a.click();
    }
    if (act === 'csv') {
      var rows = cardRows(card);
      var groups = aggregate(rows, card.dim, card.topn != null ? card.topn : G.topn);
      var total = groups.reduce(function(s, g) { return s + metricOf(g, card.metric); }, 0) || 1;
      var lines = [DIMS[card.dim].label + ',装机容量GW,机组数,电厂数,占比%'].concat(
        groups.map(function(g) { return '"' + g.disp + '",' + g.cap.toFixed(1) + ',' + g.units + ',' + g.plants + ',' + (metricOf(g, card.metric) / total * 100).toFixed(1); }));
      download(cardTitle(card).replace(/[\\/:*?"<>|·]/g, '-') + '.csv', '﻿' + lines.join('\n'), 'text/csv;charset=utf-8');
    }
  }

  /* ================= 右键/点击菜单 ================= */
  var ctxEl = document.getElementById('ctx-menu');
  function openCtx(x, y, items) {
    items = items.filter(Boolean);
    if (!items.length) return;
    ctxEl.innerHTML = '<div class="ctx-title">分析操作</div>' + items.map(function(it, i) {
      return '<button data-i="' + i + '">' + S.esc(it.label) + '</button>';
    }).join('');
    ctxEl.classList.add('show');
    ctxEl.style.left = Math.min(x, window.innerWidth - 230) + 'px';
    ctxEl.style.top = Math.min(y, window.innerHeight - items.length * 34 - 30) + 'px';
    ctxEl.querySelectorAll('button').forEach(function(b) {
      b.addEventListener('click', function() { closeCtx(); items[+b.getAttribute('data-i')].fn(); });
    });
  }
  function closeCtx() { ctxEl.classList.remove('show'); }
  document.addEventListener('click', function(e) { if (!ctxEl.contains(e.target)) closeCtx(); });
  document.addEventListener('scroll', closeCtx, true);

  /* ================= 明细弹窗 ================= */
  var backdrop = document.getElementById('modal-backdrop');
  function openDetail(title, filters, presetRows) {
    var rows = presetRows || RAW;
    if (filters) {
      rows = rows;
      filters.forEach(function(f) {
        if (f.value == null) return;
        var d = DIMS[f.dim];
        rows = rows.filter(function(r) { return d.key(r) === f.value; });
      });
      var g1 = applyG(rows); // 应用全局筛选
      rows = presetRows ? g1 : g1;
    } else {
      rows = applyG(rows);
    }
    modalRows = rows;
    document.getElementById('modal-title').textContent = '明细记录 · ' + title;
    var show = rows.slice(0, 300);
    document.getElementById('modal-body').innerHTML =
      '<table class="detail-table"><thead><tr><th>电厂</th><th>机组</th><th>国家/地区</th><th>状态</th><th>燃料</th><th>容量MW</th><th>投运</th><th>业主</th></tr></thead><tbody>' +
      show.map(function(r) {
        return '<tr><td>' + S.esc(r[0]) + '</td><td>' + S.esc(r[1]) + '</td><td>' + S.esc(S.cnCountry(r[2])) + '</td><td>' + r[4] + '</td><td>' + r[5] + '</td><td class="cap">' + r[6].toLocaleString() + '</td><td class="cap">' + (r[9] || '') + '</td><td>' + S.esc(r[10]) + '</td></tr>';
      }).join('') + '</tbody></table>';
    document.getElementById('modal-info').textContent = '共 ' + rows.length.toLocaleString() + ' 条' + (rows.length > 300 ? '，显示前 300 条' : '');
    backdrop.classList.add('show');
  }
  document.getElementById('modal-close').addEventListener('click', function() { backdrop.classList.remove('show'); });
  backdrop.addEventListener('click', function(e) { if (e.target === backdrop) backdrop.classList.remove('show'); });
  document.getElementById('modal-export').addEventListener('click', function() {
    var lines = ['电厂名称,机组名称,国家/地区,状态,燃料大类,容量MW,投运年份,业主']
      .concat(modalRows.slice(0, 5000).map(function(r) {
        return ['"' + r[0] + '"','"' + r[1] + '"','"' + r[2] + '"', r[4], r[5], r[6], r[9] || '', '"' + (r[10] || '') + '"'].join(',');
      }));
    download('明细记录.csv', '﻿' + lines.join('\n'), 'text/csv;charset=utf-8');
  });

  function renderSidebarStatics() {

    document.getElementById('c-dim').innerHTML = DIM_KEYS.map(function(k) {
      return '<span class="f-chip' + (newCard.dim === k ? ' on' : '') + '" data-k="' + k + '">' + DIMS[k].label + '</span>';
    }).join('');

    }).join('');
    document.getElementById('c-metric').querySelectorAll('.f-chip').forEach(function(c) {
      c.addEventListener('click', function() { newCard.metric = c.getAttribute('data-k'); renderSidebarStatics(); });

      .map(function(k) { return '<option value="' + k + '">' + DIMS[k].label + '</option>'; }).join('');

  function renderStatusChips() {

      return '<span class="st-chip' + (G.status.indexOf(st) >= 0 ? ' on' : '') + '" data-st="' + st + '">' +
        '<span class="dot" style="background:' + S.STATUS_COLOR[st] + '"></span>' + st + '</span>';
    }).join('');
    document.querySelectorAll('#g-status-chips .st-chip').forEach(function(c) {
      c.addEventListener('click', function() {
        var st = c.getAttribute('data-st');
        var i = G.status.indexOf(st);
        if (i >= 0) G.status.splice(i, 1); else G.status.push(st);

  function renderSaved() {
    var list = getSaved();
    var el = document.getElementById('saved-list');
    if (!list.length) { el.innerHTML = '<div class="saved-empty">还没有保存的分析。配好画布后点顶部「保存画布」。</div>'; return; }
    el.innerHTML = '';
    list.forEach(function(sv, i) {
      var d = document.createElement('div');
      d.className = 'saved-item';
      d.innerHTML = '<div><div class="s-name">' + S.esc(sv.name) + '</div><div class="s-time">' + sv.ts + ' · ' + sv.state.cards.length + ' 张卡片</div></div><button class="s-del" title="删除">✕</button>';
      d.addEventListener('click', function() { loadState(sv.state); toast('已载入「' + sv.name + '」'); });
      d.querySelector('.s-del').addEventListener('click', function(e) {
        e.stopPropagation();
        var l = getSaved(); l.splice(i, 1); localStorage.setItem('gogpt_saved_v2', JSON.stringify(l));
        renderSaved();
      });
      el.appendChild(d);
    });

  function getSaved() { try { return JSON.parse(localStorage.getItem('gogpt_saved_v2') || '[]'); } catch (e) { return []; } }

  /* ================= 统计条 ================= */
  function renderStats() {
    var rows = applyG(RAW);
    var plants = {}, countries = {};
    rows.forEach(function(r) { plants[r[0]] = 1; countries[r[2]] = 1; });
    var cap = S.sumCap(rows) / 1000;
    var opCap = S.sumCap(rows.filter(function(r) { return r[4] === '在运'; })) / 1000;
    var avg = rows.length ? S.sumCap(rows) / rows.length : 0;
    var items = [
      ['机组', rows.length.toLocaleString() + ' 台'],
      ['电厂', Object.keys(plants).length.toLocaleString() + ' 座'],
      ['总装机', cap.toFixed(1) + ' GW'],
      ['平均单机', avg.toFixed(0) + ' MW'],
      ['在运占比', cap ? (opCap / cap * 100).toFixed(0) + '%' : '—'],
      ['国家/地区', Object.keys(countries).length]
    ];
    document.getElementById('stats-bar').innerHTML = items.map(function(it) {
      return '<div class="stat-item"><span class="sl">' + it[0] + '</span><span class="sv">' + it[1] + '</span></div>';
    }).join('') + '<div style="margin-left:auto;font-size:0.72rem;color:var(--faint)">全局筛选实时生效于所有卡片与透视表</div>';
    document.getElementById('g-filter-hint').textContent = rows.length === RAW.length ? '' : '生效中';
  }

  /* ================= 透视表 ================= */
  var pivotData = null;
  function renderPivot() {
    var rowSel = document.getElementById('p-row'), colSel = document.getElementById('p-col');
    if (!rowSel.options.length) {
      rowSel.innerHTML = DIM_KEYS.map(function(k) { return '<option value="' + k + '">' + DIMS[k].label + '</option>'; }).join('');
      colSel.innerHTML = DIM_KEYS.map(function(k) { return '<option value="' + k + '">' + DIMS[k].label + '</option>'; }).join('');
      rowSel.value = pivot.row; colSel.value = pivot.col;
      document.getElementById('p-metric').value = pivot.metric;
    }
    var rows = applyG(RAW);
    var rd = DIMS[pivot.row], cd = DIMS[pivot.col];
    function topKeys(d, n) {
      var m = {};
      rows.forEach(function(r) { var k = d.key(r); if (k != null) m[k] = (m[k] || 0) + r[6]; });
      var keys = Object.keys(m);
      if (d.order === 'num') return keys.sort(function(a, b) { return a - b; });
      if (Array.isArray(d.order)) return keys.sort(function(a, b) { return d.order.indexOf(a) - d.order.indexOf(b); });
      return keys.sort(function(a, b) { return m[b] - m[a]; }).slice(0, n);
    }
    var rk = topKeys(rd, 12), ck = topKeys(cd, 9);
    function agg(rk2, ck2) {
      var cap = 0, units = 0, pl = {};
      rows.forEach(function(r) {
        var a = rd.key(r), b = cd.key(r);
        if (a === rk2 && b === ck2) { cap += r[6]; units++; pl[r[0]] = 1; }
      });
      return { cap: cap / 1000, units: units, plants: Object.keys(pl).length };
    }
    var cells = {}, rowTot = {}, colTot = {}, grand = { cap: 0, units: 0, pl: {} };
    rk.forEach(function(a) {
      ck.forEach(function(b) {
        var v = agg(a, b);
        cells[a + '||' + b] = v;
        rowTot[a] = rowTot[a] || { cap: 0, units: 0, pl: {} };
        rowTot[a].cap += v.cap; rowTot[a].units += v.units;
        colTot[b] = colTot[b] || { cap: 0, units: 0, pl: {} };
        colTot[b].cap += v.cap; colTot[b].units += v.units;
        grand.cap += v.cap; grand.units += v.units;
        Object.keys(v).forEach(function() {});
        rows.forEach(function(r) { if (rd.key(r) === a && cd.key(r) === b) grand.pl[r[0]] = 1; });
      });
    });
    var maxV = 0;
    rk.forEach(function(a) { ck.forEach(function(b) { maxV = Math.max(maxV, metricOf(cells[a + '||' + b], pivot.metric)); }); });
    function cellStyle(v) {
      var al = maxV ? (0.04 + 0.72 * v / maxV) : 0.04;
      return 'background:rgba(14,124,111,' + al.toFixed(2) + ');' + (al > 0.45 ? 'color:#fff;' : '');
    }
    var html = '<table class="pivot-table"><thead><tr><th>' + rd.label + ' \\ ' + cd.label + '</th>' +
      ck.map(function(b) { return '<th>' + S.esc(cd.disp(b)) + '</th>'; }).join('') + '<th>合计</th></tr></thead><tbody>';
    rk.forEach(function(a) {
      html += '<tr><th>' + S.esc(rd.disp(a)) + '</th>';
      ck.forEach(function(b) {
        var v = cells[a + '||' + b];
        html += '<td class="cell" data-r="' + S.esc(String(a)) + '" data-c="' + S.esc(String(b)) + '" style="' + cellStyle(metricOf(v, pivot.metric)) + '">' + (v.units ? fmtVal(pivot.metric, metricOf(v, pivot.metric)) : '·') + '</td>';
      });
      html += '<td class="tot">' + fmtVal(pivot.metric, metricOf(rowTot[a], pivot.metric)) + '</td></tr>';
    });
    html += '<tr class="tot"><th>合计</th>' + ck.map(function(b) {
      var t = colTot[b] || { cap: 0, units: 0, plants: 0 };
      return '<td class="tot">' + fmtVal(pivot.metric, metricOf(t, pivot.metric)) + '</td>';
    }).join('') + '<td class="tot">' + fmtVal(pivot.metric, metricOf(grand, pivot.metric)) + '</td></tr>';
    html += '</tbody></table>';
    document.getElementById('pivot-wrap').innerHTML = html;
    pivotData = { rk: rk, ck: ck, rd: rd, cd: cd };
    document.querySelectorAll('#pivot-wrap td.cell').forEach(function(td) {
      td.addEventListener('click', function() {
        var a = td.getAttribute('data-r'), b = td.getAttribute('data-c');
        openDetail(rd.disp(a) + ' × ' + cd.disp(b), [{ dim: pivot.row, value: a }, { dim: pivot.col, value: b }]);
      });
    });
  }
  ['p-row', 'p-col', 'p-metric'].forEach(function(id) {
    document.getElementById(id).addEventListener('change', function() {
      pivot.row = document.getElementById('p-row').value;
      pivot.col = document.getElementById('p-col').value;
      pivot.metric = document.getElementById('p-metric').value;
      if (pivot.row === pivot.col) { toast('行/列维度相同没有意义，请换一个'); return; }
      renderPivot();
    });
  });
  document.getElementById('p-export').addEventListener('click', function() {
    if (!pivotData) return;
    var lines = [DIMS[pivot.row].label + ',' + DIMS[pivot.col].label + ',' + METRICS[pivot.metric].label];
    pivotData.rk.forEach(function(a) {
      pivotData.ck.forEach(function(b) {
        var rows = applyG(RAW).filter(function(r) { return pivotData.rd.key(r) === a && pivotData.cd.key(r) === b; });
        if (rows.length) lines.push('"' + pivotData.rd.disp(a) + '","' + pivotData.cd.disp(b) + '",' + fmtVal(pivot.metric, metricOf({ cap: S.sumCap(rows) / 1000, units: rows.length, plants: 0 }, pivot.metric)));
      });
    });
    download('透视表-' + DIMS[pivot.row].label + 'x' + DIMS[pivot.col].label + '.csv', '﻿' + lines.join('\n'), 'text/csv;charset=utf-8');
  });

  /* ================= 模式切换 ================= */
  function setMode(m) {
    mode = m;
    document.getElementById('tab-canvas').classList.toggle('on', m === 'canvas');
    document.getElementById('tab-pivot').classList.toggle('on', m === 'pivot');
    document.getElementById('mode-canvas').style.display = m === 'canvas' ? '' : 'none';
    document.getElementById('mode-pivot').style.display = m === 'pivot' ? '' : 'none';
    if (m === 'pivot') renderPivot(); else renderCards();
  }
  document.getElementById('tab-canvas').addEventListener('click', function() { setMode('canvas'); });
  document.getElementById('tab-pivot').addEventListener('click', function() { setMode('pivot'); });

  /* ================= 保存 / 分享 / 序列化 ================= */
  function serialize() {
    return {
      g: { region: G.region, status: G.status, fuel: G.fuel, country: G.country, kw: G.kw, topn: G.topn },
      cards: cards.map(function(c) { return { dim: c.dim, metric: c.metric, chart: c.chart, dim2: c.dim2, topn: c.topn, drill: c.drill, full: !!c.full }; }),
      pivot: pivot
    };
  }
  function loadState(st) {
    G = { region: st.g.region || '', status: (st.g.status || []).slice(), fuel: st.g.fuel || '', country: st.g.country || '', kw: st.g.kw || '', topn: st.g.topn || 15 };
    cards = (st.cards || []).map(function(c) { return { id: uid++, dim: c.dim, metric: c.metric, chart: c.chart, dim2: c.dim2 || '', topn: c.topn != null ? c.topn : 15, drill: (c.drill || []).slice(), full: !!c.full }; });
    if (st.pivot) pivot = { row: st.pivot.row || 'country', col: st.pivot.col || 'status', metric: st.pivot.metric || 'cap' };
    syncFilterUI();
    setMode('canvas');
    refreshAll();
  }
  var persistT;
  function persistLast() {
    clearTimeout(persistT);
    persistT = setTimeout(function() {
      try { localStorage.setItem('gogpt_last_v2', JSON.stringify(serialize())); } catch (e) {}
    }, 400);
  }
  document.getElementById('btn-save').addEventListener('click', function() {
    var name = prompt('给这套分析起个名字：', '我的分析 ' + new Date().toLocaleDateString('zh-CN'));
    if (!name) return;
    var l = getSaved();
    l.unshift({ name: name, ts: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }), state: serialize() });
    localStorage.setItem('gogpt_saved_v2', JSON.stringify(l.slice(0, 20)));
    renderSaved();
    toast('已保存「' + name + '」');
  });
  document.getElementById('btn-share').addEventListener('click', function() {
    location.hash = 's=' + b64enc(JSON.stringify(serialize()));
    var url = location.href;
    if (navigator.clipboard) navigator.clipboard.writeText(url);
    toast('链接已复制，发给同事即可打开同样的画布');
  });
  document.getElementById('btn-clear').addEventListener('click', function() {
    cards = []; renderCards(); persistLast();
  });

  /* ================= 报告 v2 ================= */
  function blocksToMd(blocks) {
    return blocks.map(function(b) {
      if (b.t === 'h1') return '# ' + b.v;
      if (b.t === 'h2') return '## ' + b.v;
      if (b.t === 'h4') return '#### ' + b.v;
      if (b.t === 'p') return b.v;
      if (b.t === 'ul') return b.items.map(function(i) { return '- ' + i; }).join('\n');
      if (b.t === 'table') return null; // md 中表格单独拼
      if (b.t === 'meta') return '> ' + b.v;
      return '';
    }).filter(function(x) { return x !== null; }).join('\n\n');
  }
  function buildReport() {
    var blocks = [];
    var rows = applyG(RAW);
    var today = new Date().toISOString().slice(0, 10);
    blocks.push({ t: 'h1', v: '全球油气电厂数据分析报告' });
    blocks.push({ t: 'meta', v: '数据：Global Energy Monitor GOGPT ' + S.VERSION + ' · 生成：' + today + ' · GOGPT 数据观察站分析工具' });
    blocks.push({ t: 'h2', v: '一、分析范围' });
    var fd = [];
    if (G.region) fd.push('大区=' + G.region);
    if (G.status.length) fd.push('状态=' + G.status.join('/'));
    if (G.fuel) fd.push('燃料=' + G.fuel);
    if (G.country) fd.push('国家≈' + G.country);
    if (G.kw) fd.push('关键词≈' + G.kw);
    var plants = {}, countries = {};
    rows.forEach(function(r) { plants[r[0]] = 1; countries[r[2]] = 1; });
    blocks.push({ t: 'ul', items: [
      '筛选条件：' + (fd.length ? fd.join('，') : '无（全量数据）'),
      '覆盖：' + rows.length.toLocaleString() + ' 台机组 / ' + Object.keys(plants).length.toLocaleString() + ' 座电厂 / ' + Object.keys(countries).length + ' 个国家/地区',
      '总装机：' + (S.sumCap(rows) / 1000).toFixed(1) + ' GW',
      '本报告由 ' + cards.length + ' 张分析卡片组成' ]});
    cards.forEach(function(card, ci) {
      var crows = cardRows(card);
      var groups = aggregate(crows, card.dim, card.topn != null ? card.topn : G.topn);
      var st = cardStats(groups, card.metric);
      var total = groups.reduce(function(s, g) { return s + metricOf(g, card.metric); }, 0) || 1;
      blocks.push({ t: 'h2', v: (ci + 2) + '、' + cardTitle(card) });
      blocks.push({ t: 'p', v: '基于 ' + crows.length.toLocaleString() + ' 台机组，共 ' + groups.length + ' 组；集中度 CR3 ' + st.cr3.toFixed(1) + '%、CR10 ' + st.cr10.toFixed(1) + '%、HHI ' + st.hhi + (st.hhi > 2500 ? '（高度集中）' : (st.hhi > 1500 ? '（中等集中）' : '（较为分散）')) + '。' });
      if (groups.length) {
        var g0 = groups[0], g1 = groups[1];
        if (g0 && g1 && g0.key !== '__other') blocks.push({ t: 'p', v: '首位为 **' + g0.disp + '**（' + fmtVal(card.metric, metricOf(g0, card.metric)) + '，占 ' + (metricOf(g0, card.metric) / total * 100).toFixed(1) + '%），为第二名 ' + g1.disp + ' 的 ' + (metricOf(g0, card.metric) / Math.max(metricOf(g1, card.metric), 0.001)).toFixed(1) + ' 倍。' });
      }
      blocks.push({ t: 'table', v: groups.slice(0, 8).map(function(g) {
        return [g.disp, g.cap.toFixed(1), g.units.toLocaleString(), g.plants.toLocaleString(), (metricOf(g, card.metric) / total * 100).toFixed(1) + '%'];
      }), head: [DIMS[card.dim].label, '装机GW', '机组', '电厂', '占比'] });
      blocks.push({ t: 'img', cardId: card.id });
    });
    blocks.push({ t: 'p', v: '---' });
    blocks.push({ t: 'meta', v: '本报告由 GOGPT 数据观察站分析工具自动生成，数据以 Global Energy Monitor 官方发布为准（CC BY 4.0）。' });
    return blocks;
  }
  function blocksToHtml(blocks, withImages) {
    function inline(t) { return String(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }
    var html = '';
    blocks.forEach(function(b) {
      if (b.t === 'h1') html += '<h2>' + inline(b.v) + '</h2>';
      else if (b.t === 'h2') html += '<h4>' + inline(b.v) + '</h4>';
      else if (b.t === 'meta') html += '<p class="rp-meta">' + inline(b.v) + '</p>';
      else if (b.t === 'p') html += '<p>' + inline(b.v).replace(/^---$/, '<hr>') + '</p>';
      else if (b.t === 'ul') html += '<ul>' + b.items.map(function(i) { return '<li>' + inline(i) + '</li>'; }).join('') + '</ul>';
      else if (b.t === 'table') {
        html += '<table><thead><tr>' + b.head.map(function(h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>' +
          b.v.map(function(r) { return '<tr>' + r.map(function(c, i) { return '<' + (i ? 'td' : 'td') + (i ? ' style="text-align:right;font-family:GeistMono,monospace"' : '') + '>' + c + '</td>'; }).join('') + '</tr>'; }).join('') + '</tbody></table>';
      } else if (b.t === 'img' && withImages) {
        var inst = chartMap[b.cardId];
        if (inst) {
          try { html += '<img class="rp-chart-img" src="' + inst.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' }) + '" alt="图表">'; } catch (e) {}
        }
      }
    });
    return html;
  }
  function blocksToMdFull(blocks) {
    var out = [];
    blocks.forEach(function(b) {
      if (b.t === 'h1') out.push('# ' + b.v);
      else if (b.t === 'h2') out.push('## ' + b.v);
      else if (b.t === 'h4') out.push('#### ' + b.v);
      else if (b.t === 'meta') out.push('> ' + b.v);
      else if (b.t === 'p') out.push(b.v);
      else if (b.t === 'ul') out.push(b.items.map(function(i) { return '- ' + i; }).join('\n'));
      else if (b.t === 'table') {
        out.push('| ' + b.head.join(' | ') + ' |');
        out.push('|' + b.head.map(function() { return '---'; }).join('|') + '|');
        b.v.forEach(function(r) { out.push('| ' + r.join(' | ') + ' |'); });
      }
      else if (b.t === 'img') out.push('*（图表见 HTML 版报告）*');
    });
    return out.join('\n\n');
  }
  var lastBlocks = null;
  document.getElementById('btn-report').addEventListener('click', function() {
    if (!cards.length) { toast('画布是空的，先添加分析卡片'); return; }
    lastBlocks = buildReport();
    document.getElementById('report-body').innerHTML = blocksToHtml(lastBlocks, true);
    var panel = document.getElementById('report-panel');
    panel.classList.add('show');
    panel.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
  document.getElementById('rp-copy').addEventListener('click', function() {
    if (!lastBlocks) return;
    navigator.clipboard.writeText(blocksToMdFull(lastBlocks)).then(function() {
      var b = document.getElementById('rp-copy');
      b.textContent = '已复制 ✓'; setTimeout(function() { b.textContent = '复制 Markdown'; }, 1500);
    });
  });
  document.getElementById('rp-md').addEventListener('click', function() {
    if (!lastBlocks) return;
    download('全球油气电厂数据分析报告.md', '﻿' + blocksToMdFull(lastBlocks), 'text/markdown;charset=utf-8');
  });
  document.getElementById('rp-html').addEventListener('click', function() {
    if (!lastBlocks) return;
    var body = blocksToHtml(lastBlocks, true);
    var html = '<!-- Generated by Trae Work --><!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>全球油气电厂数据分析报告</title><style>' +
      'body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:52rem;margin:2rem auto;padding:0 1.2rem;color:#1b2430;line-height:1.7}' +
      'h2{font-size:1.5rem;font-weight:800;margin:1.6rem 0 .7rem}h4{font-size:1.1rem;font-weight:700;margin:1.3rem 0 .5rem}' +
      'p{font-size:.92rem;color:#4a5568;margin-bottom:.55rem}p b,li b{color:#1b2430}ul{padding-left:1.2rem}li{font-size:.92rem;color:#4a5568;margin-bottom:.3rem}' +
      'table{width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0 1rem}th,td{border:1px solid #e7e4dc;padding:.4rem .6rem;text-align:left}th{background:#faf9f5}' +
      '.rp-meta{font-size:.78rem;color:#9aa3b2}img{max-width:100%;border:1px solid #e7e4dc;border-radius:10px;margin:8px 0 14px}</style></head><body>' + body + '</body></html>';
    download('全球油气电厂数据分析报告.html', html, 'text/html;charset=utf-8');
  });

  /* ================= 全局刷新与初始化 ================= */
  function refreshAll() {
    renderStats();
    if (mode === 'canvas') renderCards(); else renderPivot();
    persistLast();
  }
  function syncFilterUI() {
    var regions = [], fuels = [];
    RAW.forEach(function(r) {
      if (regions.indexOf(r[3]) < 0) regions.push(r[3]);
      if (fuels.indexOf(r[5]) < 0) fuels.push(r[5]);
    });
    var rSel = document.getElementById('g-region');
    if (!rSel.options.length) {
      rSel.innerHTML = '<option value="">全部</option>' + regions.sort().map(function(v) { return '<option value="' + v + '">' + v + '</option>'; }).join('');
      var fSel = document.getElementById('g-fuel');
      fSel.innerHTML = '<option value="">全部</option>' + S.FUEL_ORDER.filter(function(f) { return fuels.indexOf(f) >= 0; }).map(function(v) { return '<option value="' + v + '">' + v + '</option>'; }).join('');
    }
    rSel.value = G.region;
    document.getElementById('g-fuel').value = G.fuel;
    document.getElementById('g-topn').value = String(G.topn);
    document.getElementById('g-country').value = G.country;
    document.getElementById('g-kw').value = G.kw;
    renderStatusChips();
  }

  // 事件绑定
  document.getElementById('g-region').addEventListener('change', function() { G.region = this.value; refreshAll(); });
  document.getElementById('g-fuel').addEventListener('change', function() { G.fuel = this.value; refreshAll(); });
  document.getElementById('g-topn').addEventListener('change', function() { G.topn = +this.value; refreshAll(); });
  var debG = S.debounce(refreshAll, 280);
  document.getElementById('g-country').addEventListener('input', function() { G.country = this.value; debG(); });
  document.getElementById('g-kw').addEventListener('input', function() { G.kw = this.value; debG(); });
  document.getElementById('g-reset').addEventListener('click', function() {
    G = { region: '', status: [], fuel: '', country: '', kw: '', topn: G.topn };
    syncFilterUI(); refreshAll();
  });
  document.getElementById('c-chart').addEventListener('change', function() { newCard.chart = this.value; });
  document.getElementById('c-dim2').addEventListener('change', function() { newCard.dim2 = this.value; });
  document.getElementById('c-add').addEventListener('click', function() {
    cards.push({ id: uid++, dim: newCard.dim, metric: newCard.metric, chart: newCard.chart, dim2: newCard.dim2, topn: G.topn, drill: [], full: false });
    setMode('canvas');
    refreshAll();
    var els = document.querySelectorAll('.ana-card');
    if (els.length) els[els.length - 1].scrollIntoView({ behavior: 'smooth', block: 'center' });
  });
  window.addEventListener('resize', S.debounce(function() {
    Object.keys(chartMap).forEach(function(id) { chartMap[id].resize(); });
  }, 200));

  // 初始化：分享链接 > 上次画布 > 默认模板 > 旧版 ?dim= 链接
  renderTemplates(); renderSaved(); renderSidebarStatics(); syncFilterUI();
  var booted = false;
  if (location.hash.indexOf('#s=') === 0) {
    try { loadState(JSON.parse(b64dec(location.hash.slice(3)))); booted = true; } catch (e) {}
  }
  if (!booted) {
    var last = null;
    try { last = JSON.parse(localStorage.getItem('gogpt_last_v2') || 'null'); } catch (e) {}
    if (last && last.cards && last.cards.length) { loadState(last); booted = true; }
  }
  if (!booted && qs.get('dim')) {
    var sts = qs.get('status');
    if (sts) G.status = sts.split(',');
    cards = [{ id: uid++, dim: qs.get('dim'), metric: qs.get('metric') || 'cap', chart: 'auto', dim2: '', topn: 15, drill: [], full: true }];
    syncFilterUI(); refreshAll(); booted = true;
  }
  if (!booted) loadTemplate(TEMPLATES[0]);
})();
</script>
</body>
