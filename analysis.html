<head>

<meta name="description" content="全球油气电厂自由分析工具：自选维度、指标与图表类型，一键生成中文分析报告。">

<body>
<div class="wrap">

<div class="page-head">
  <div class="overline">分析工具</div>
  <h1>自由组合，挖出你想看的角度</h1>
  <div class="sub">选择分析维度、指标和图表类型，基于 13,895 条机组记录自由分析；筛选条件实时生效，结果可一键生成中文分析报告。</div>

  <span class="f-label">筛选</span>
  <select id="f-region"><option value="">全部大区</option></select>
  <select id="f-status"><option value="">全部状态</option></select>
  <select id="f-fuel"><option value="">全部燃料</option></select>
  <input type="text" id="f-country" placeholder="国家/地区（中/英文）…">

        <option value="country">国家/地区</option>
        <option value="region">大区</option>
        <option value="status">运营状态</option>

        <option value="">无</option>

      <label>显示数量</label>
      <select id="w-topn">
        <option value="10">Top 10</option>

        <option value="50">Top 50</option>
        <option value="0">全部</option>
      </select>
    </div>
    <button class="btn primary" id="btn-report">生成分析报告</button>
  </div>

      <thead><tr>
        <th>#</th><th id="agg-dim-head">维度</th>
        <th class="cap">装机容量 (GW)</th><th class="cap">机组数 (台)</th><th class="cap">电厂数 (座)</th><th class="cap">占比</th>
      </tr></thead>

    </table>

<script src="./_shared/js/echarts.min.js"></script>
<script src="assets/data.js"></script>
<script src="assets/site.js"></script>
<script>
(function() {
  var S = window.SITE, RAW = window.GOGPT_DATA;
  var params = S.getParams();
  var qs = new URLSearchParams(location.search);

  var state = {
    region: params.region, fuel: params.fuel,
    status: params.status.length === 1 ? params.status[0] : '',
    country: params.country, kw: params.kw,
    dim: qs.get('dim') || 'country',
    metric: qs.get('metric') || 'cap',
    chart: qs.get('chart') || 'auto',
    dim2: qs.get('dim2') || '',
    topn: qs.get('topn') != null ? +qs.get('topn') : 15
  };

  var DIMS = {
    country: { label: '国家/地区', idx: 2, key: function(r) { return r[2] || '未知'; }, disp: function(k) { return S.cnCountry(k); } },
    region:  { label: '大区', idx: 3, key: function(r) { return r[3] || '未知'; }, disp: function(k) { return k; } },
    status:  { label: '运营状态', idx: 4, key: function(r) { return r[4] || '未知'; }, disp: function(k) { return k; } },
    fuel:    { label: '燃料大类', idx: 5, key: function(r) { return r[5] || '未知'; }, disp: function(k) { return k; } },
    owner:   { label: '业主', idx: 10, key: function(r) { return (r[10] || '未知').split(';')[0].trim() || '未知'; }, disp: function(k) { return k; } },
    year:    { label: '投运年份', idx: 9, key: function(r) { return r[9] && r[9] >= 1930 && r[9] <= 2035 ? (r[9] < 1980 ? 1979 : r[9]) : null; }, disp: function(k) { return k === 1979 ? '<1980' : String(k); } }
  };
  var METRICS = { cap: '装机容量 (GW)', units: '机组数量 (台)', plants: '电厂数量 (座)' };

  // ===== 筛选控件 =====
  function fillSelect(id, values) {
    var sel = document.getElementById(id);
    values.forEach(function(v) {
      var o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
    });
  }
  var regions = [], fuels = [];
  RAW.forEach(function(r) {
    if (regions.indexOf(r[3]) < 0) regions.push(r[3]);
    if (fuels.indexOf(r[5]) < 0) fuels.push(r[5]);
  });
  fillSelect('f-region', regions.sort());
  fillSelect('f-status', S.STATUS_ORDER);
  fillSelect('f-fuel', S.FUEL_ORDER.filter(function(f) { return fuels.indexOf(f) >= 0; }));
  if (state.region) document.getElementById('f-region').value = state.region;
  if (state.status) document.getElementById('f-status').value = state.status;
  if (state.fuel) document.getElementById('f-fuel').value = state.fuel;
  if (state.country) document.getElementById('f-country').value = state.country;
  if (state.kw) document.getElementById('f-keyword').value = state.kw;
  document.getElementById('w-dim').value = state.dim;
  document.getElementById('w-metric').value = state.metric;
  document.getElementById('w-chart').value = state.chart;
  document.getElementById('w-dim2').value = state.dim2;
  document.getElementById('w-topn').value = String(state.topn);

  // ===== 聚合 =====
  var filtered = RAW, groups = [], dim2Cats = [], chartType = 'bar_v';
  var chart = echarts.init(document.getElementById('wb-chart'));
  window.addEventListener('resize', function() { chart.resize(); });

  function aggregate() {
    var dim = DIMS[state.dim];
    var map = {};
    filtered.forEach(function(r) {
      var k = dim.key(r);
      if (k == null) return;
      if (!map[k]) map[k] = { key: k, cap: 0, units: 0, plants: {}, rows: [] };
      var g = map[k];
      g.cap += r[6]; g.units++; g.plants[r[0]] = 1; g.rows.push(r);
    });
    var arr = Object.keys(map).map(function(k) {
      var g = map[k];
      return { key: g.key, disp: dim.disp(g.key), cap: g.cap / 1000, units: g.units, plants: Object.keys(g.plants).length, rows: g.rows };
    });
    if (state.dim === 'year') arr.sort(function(a, b) { return a.key - b.key; });
    else arr.sort(function(a, b) { return metricOf(b) - metricOf(a); });
    // Top N + 其他
    if (state.dim !== 'year' && state.topn > 0 && arr.length > state.topn) {
      var rest = arr.slice(state.topn);
      var other = { key: '__other', disp: '其他 (' + rest.length + ')', cap: 0, units: 0, plants: 0, rows: [] };
      var plantSet = {};
      rest.forEach(function(g) { other.cap += g.cap; other.units += g.units; g.rows.forEach(function(r) { plantSet[r[0]] = 1; }); other.rows = other.rows.concat(g.rows); });
      other.plants = Object.keys(plantSet).length;
      arr = arr.slice(0, state.topn).concat([other]);
    }
    groups = arr;
    // 对比维度类别
    dim2Cats = [];
    if (state.dim2) {
      var d2 = DIMS[state.dim2];
      var cm = {};
      filtered.forEach(function(r) {
        var k = d2.key(r);
        if (k != null) cm[k] = (cm[k] || 0) + r[6];
      });
      dim2Cats = Object.keys(cm).sort(function(a, b) { return cm[b] - cm[a]; }).slice(0, 8);
    }
  }
  function metricOf(g) { return state.metric === 'cap' ? g.cap : (state.metric === 'units' ? g.units : g.plants); }
  function metricOfRows(rows) {
    if (state.metric === 'cap') return S.sumCap(rows) / 1000;
    if (state.metric === 'units') return rows.length;
    var p = {}; rows.forEach(function(r) { p[r[0]] = 1; });
    return Object.keys(p).length;
  }
  function fmtVal(v) { return state.metric === 'cap' ? v.toFixed(1) : v.toLocaleString(); }

  // ===== 图表 =====
  function renderChart() {
    var dim = DIMS[state.dim];
    chartType = state.chart;
    if (chartType === 'auto') chartType = state.dim === 'year' ? 'line' : 'bar_v';
    if (state.dim2 && chartType !== 'bar_v') state.dim2tmpIgnored = true;
    var title = '按' + dim.label + ' · ' + METRICS[state.metric];
    document.getElementById('wb-title').textContent = title;
    document.getElementById('wb-sub').textContent =
      (state.dim2 && chartType === 'bar_v' ? '按' + DIMS[state.dim2].label + '堆叠 · ' : '') +
      '基于当前筛选 ' + filtered.length.toLocaleString() + ' 台机组 · 共 ' + groups.length + ' 组';

    var cats = groups.map(function(g) { return g.disp; });
    var option;
    var tooltip = Object.assign({}, S.EC.tooltip);

    if (chartType === 'pie') {
      option = {
        animation: false, tooltip: Object.assign(tooltip, { formatter: function(p) { return p.name + '<br/><b>' + fmtVal(p.value) + '</b> (' + p.percent + '%)'; } }),
        legend: { bottom: 0, textStyle: { color: '#6b7688', fontSize: 11 }, itemWidth: 12, itemHeight: 8, type: 'scroll' },
        color: ['#0e7c6f', '#5aa89e', '#e8a33d', '#8f77d4', '#4f8fd0', '#d4536a', '#94a3b8', '#c9a227', '#7a8ca3', '#c3cad4'],
        series: [{
          type: 'pie', radius: ['42%', '68%'], center: ['50%', '48%'],
          label: { color: '#1b2430', formatter: '{b}\n{d}%', fontSize: 11, lineHeight: 15 },
          labelLine: { lineStyle: { color: '#9aa3b2' } },
          itemStyle: { borderColor: '#ffffff', borderWidth: 2, borderRadius: 4 },
          data: groups.map(function(g) { return { name: g.disp, value: +metricOf(g).toFixed(2) }; })
        }]
      };
    } else if (chartType === 'line') {
      option = {
        animation: false, tooltip: Object.assign(tooltip, { trigger: 'axis' }),
        grid: { left: 64, right: 30, top: 34, bottom: 56 },
        xAxis: { type: 'category', data: cats, axisLabel: { color: '#6b7688', fontSize: 10 }, axisLine: S.EC.axisLine, axisTick: { show: false } },
        yAxis: { type: 'value', axisLabel: S.EC.axisLabel, splitLine: S.EC.splitLine },
        series: [{
          name: METRICS[state.metric], type: 'line', data: groups.map(function(g) { return +metricOf(g).toFixed(2); }),
          symbol: 'circle', symbolSize: 5, smooth: 0.2,
          lineStyle: { color: '#0e7c6f', width: 2.5 }, itemStyle: { color: '#0e7c6f' },
          areaStyle: { color: { type: 'linear', x: 0, y: 0, x2: 0, y2: 1,
            colorStops: [{ offset: 0, color: 'rgba(14,124,111,.18)' }, { offset: 1, color: 'rgba(14,124,111,0)' }] } }
        }]
      };
    } else if (chartType === 'bar_h') {
      option = {
        animation: false, tooltip: Object.assign(tooltip, { formatter: function(p) { return p.name + '<br/><b>' + fmtVal(p.value) + '</b>'; } }),
        grid: { left: 8, right: 70, top: 14, bottom: 26, containLabel: true },
        xAxis: { type: 'value', axisLabel: S.EC.axisLabel, splitLine: S.EC.splitLine },
        yAxis: { type: 'category', inverse: true, data: cats,
          axisLabel: { color: '#1b2430', fontSize: 11 }, axisLine: S.EC.axisLine, axisTick: { show: false } },
        series: [{
          type: 'bar', barWidth: 14,
          data: groups.map(function(g) { return { value: +metricOf(g).toFixed(2), itemStyle: { color: '#0e7c6f', borderRadius: [0, 5, 5, 0] } }; }),
          label: { show: true, position: 'right', color: '#6b7688', fontSize: 10, formatter: function(p) { return fmtVal(p.value); } }
        }]
      };
    } else { // bar_v
      var series;
      if (state.dim2) {
        var d2 = DIMS[state.dim2];
        series = dim2Cats.concat(['__other2']).map(function(ck) {
          return {
            name: ck === '__other2' ? '其他' : d2.disp(ck), type: 'bar', stack: 'total', barMaxWidth: 26,
            itemStyle: { color: ck === '__other2' ? '#c3cad4' : (S.STATUS_COLOR[ck] || undefined) },
            emphasis: { focus: 'series' },
            data: groups.map(function(g) {
              var rows = g.rows.filter(function(r) {
                var k = d2.key(r);
                return ck === '__other2' ? dim2Cats.indexOf(k) < 0 : k === ck;
              });
              return +metricOfRows(rows).toFixed(2);
            })
          };
        });
        // 配色兜底
        var pal = ['#0e7c6f', '#e8a33d', '#8f77d4', '#4f8fd0', '#94a3b8', '#d4536a', '#c9a227', '#5aa89e'];
        series.forEach(function(sr, i) { if (!sr.itemStyle.color) sr.itemStyle.color = pal[i % pal.length]; });
      } else {
        series = [{
          type: 'bar', barMaxWidth: 26,
          data: groups.map(function(g) {
            var c = state.dim === 'status' ? (S.STATUS_COLOR[g.key] || '#0e7c6f') : '#0e7c6f';
            return { value: +metricOf(g).toFixed(2), itemStyle: { color: c, borderRadius: [4, 4, 0, 0] } };
          })
        }];
      }
      option = {
        animation: false,
        tooltip: Object.assign(tooltip, { trigger: 'axis', axisPointer: { type: 'shadow' } }),
        legend: state.dim2 ? { top: 0, textStyle: { color: '#6b7688', fontSize: 11 }, itemWidth: 12, itemHeight: 8, type: 'scroll' } : undefined,
        grid: { left: 64, right: 20, top: state.dim2 ? 42 : 26, bottom: state.dim === 'year' ? 56 : 92 },
        xAxis: { type: 'category', data: cats,
          axisLabel: { color: '#6b7688', fontSize: 10, interval: 0, rotate: state.dim === 'year' ? 45 : 34 },
          axisLine: S.EC.axisLine, axisTick: { show: false } },
        yAxis: { type: 'value', axisLabel: S.EC.axisLabel, splitLine: S.EC.splitLine },
        series: series
      };
    }
    chart.setOption(option, { notMerge: true });
  }

  // ===== 聚合表 =====
  function renderTable() {
    var dim = DIMS[state.dim];
    document.getElementById('agg-dim-head').textContent = dim.label;
    var totalMetric = groups.reduce(function(s, g) { return s + metricOf(g); }, 0);
    document.getElementById('agg-body').innerHTML = groups.map(function(g, i) {
      return '<tr><td>' + (i + 1) + '</td><td title="' + S.esc(g.disp) + '">' + S.esc(g.disp) + '</td>' +
        '<td class="cap">' + g.cap.toFixed(1) + '</td><td class="cap">' + g.units.toLocaleString() + '</td>' +
        '<td class="cap">' + g.plants.toLocaleString() + '</td>' +
        '<td class="cap">' + (totalMetric ? (metricOf(g) / totalMetric * 100).toFixed(1) : '0.0') + '%</td></tr>';
    }).join('');
  }

  function refresh() {
    filtered = S.filterRows(RAW, {
      region: state.region, fuel: state.fuel,
      status: state.status ? [state.status] : [],
      country: state.country, kw: state.kw
    });
    document.getElementById('f-count').innerHTML = '当前筛选 <b>' + filtered.length.toLocaleString() + '</b> 条';
    aggregate();
    renderChart();
    renderTable();
  }

  // ===== 报告生成 =====
  function filterDesc() {
    var parts = [];
    if (state.region) parts.push('大区=' + state.region);
    if (state.status) parts.push('状态=' + state.status);
    if (state.fuel) parts.push('燃料=' + state.fuel);
    if (state.country) parts.push('国家/地区≈' + state.country);
    if (state.kw) parts.push('关键词≈' + state.kw);
    return parts.length ? parts.join('，') : '无（全量数据）';
  }
  function buildReport() {
    var dim = DIMS[state.dim];
    var totalCap = groups.reduce(function(s, g) { return s + g.cap; }, 0);
    var totalUnits = groups.reduce(function(s, g) { return s + g.units; }, 0);
    var totalPlants = groups.reduce(function(s, g) { return s + g.plants; }, 0);
    var totalMetric = groups.reduce(function(s, g) { return s + metricOf(g); }, 0);
    var today = new Date().toISOString().slice(0, 10);
    var chartTypes = { bar_v: '柱状图', bar_h: '条形图', pie: '饼图', line: '折线图' };
    var title = '全球油气电厂数据分析报告 · 按' + dim.label;

    var g0 = groups[0], g1 = groups[1];
    var cr3 = totalMetric ? groups.slice(0, 3).reduce(function(s, g) { return s + metricOf(g); }, 0) / totalMetric * 100 : 0;
    var cr10 = totalMetric ? groups.slice(0, 10).reduce(function(s, g) { return s + metricOf(g); }, 0) / totalMetric * 100 : 0;

    var md = [];
    md.push('# ' + title);
    md.push('');
    md.push('> 数据：Global Energy Monitor GOGPT ' + S.VERSION + ' · 生成时间：' + today + ' · 分析工具：GOGPT 数据观察站');
    md.push('');
    md.push('## 一、分析范围');
    md.push('');
    md.push('- 筛选条件：' + filterDesc());
    md.push('- 覆盖记录：' + totalUnits.toLocaleString() + ' 台机组 / ' + totalPlants.toLocaleString() + ' 座电厂');
    md.push('- 总装机容量：' + totalCap.toFixed(1) + ' GW');
    md.push('- 分析视角：按' + dim.label + '分组，指标为' + METRICS[state.metric] + (state.dim2 && chartType === 'bar_v' ? '，并按' + DIMS[state.dim2].label + '堆叠对比' : '') + '（' + chartTypes[chartType] + '）');
    md.push('');
    md.push('## 二、总体概况');
    md.push('');
    md.push('在当前分析范围内，' + dim.label + '共分为 ' + groups.length + ' 组。' +
      (g0 ? '排名第一的是 **' + g0.disp + '**，' + METRICS[state.metric] + '为 **' + fmtVal(metricOf(g0)) + '**，占总量 ' + (metricOf(g0) / totalMetric * 100).toFixed(1) + '%。' : ''));
    md.push('');
    md.push('## 三、' + dim.label + '结构（Top ' + Math.min(groups.length, 10) + '）');
    md.push('');
    md.push('| # | ' + dim.label + ' | 装机容量 (GW) | 机组数 (台) | 电厂数 (座) | 占比 |');
    md.push('|---|---|---|---|---|---|');
    groups.slice(0, 10).forEach(function(g, i) {
      md.push('| ' + (i + 1) + ' | ' + g.disp + ' | ' + g.cap.toFixed(1) + ' | ' + g.units.toLocaleString() + ' | ' + g.plants.toLocaleString() + ' | ' + (metricOf(g) / totalMetric * 100).toFixed(1) + '% |');
    });
    md.push('');
    md.push('## 四、要点结论');
    md.push('');
    if (g0 && g1) md.push('- **头部领先**：' + g0.disp + '以 ' + fmtVal(metricOf(g0)) + ' 居首，是第二名 ' + g1.disp + '（' + fmtVal(metricOf(g1)) + '）的 ' + (metricOf(g0) / metricOf(g1)).toFixed(1) + ' 倍。');
    md.push('- **集中度**：CR3（前三组）占 ' + cr3.toFixed(1) + '%，CR10 占 ' + cr10.toFixed(1) + '%，' + (cr3 > 60 ? '集中度高，头部效应显著。' : (cr3 > 40 ? '集中度中等，头部有明显优势。' : '分布相对分散。')));
    if (groups.length > 10) md.push('- **长尾**：Top 10 之外仍有 ' + (groups.length - 10) + ' 组，合计占 ' + (100 - cr10).toFixed(1) + '%。');
    if (state.dim2 && chartType === 'bar_v') md.push('- **结构对比**：按' + DIMS[state.dim2].label + '堆叠后可见各组内部构成差异，明细见聚合结果表。');
    md.push('');
    md.push('---');
    md.push('*本报告由 GOGPT 数据观察站分析工具自动生成，数据以 Global Energy Monitor 官方发布为准（CC BY 4.0）。*');

    return { title: title, md: md.join('\n'), groups: groups, totalCap: totalCap, totalUnits: totalUnits, totalPlants: totalPlants, totalMetric: totalMetric };
  }

  function mdToHtml(md) {
    var lines = md.split('\n'), html = [], inTable = false, inUl = false;
    function inline(t) {
      return t.replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/\*(.+?)\*/g, '<i>$1</i>');
    }
    lines.forEach(function(l) {
      if (/^\|.*\|$/.test(l)) {
        if (!inTable) { html.push('<table><tbody>'); inTable = true; }
        if (/^\|[\s\-|]+\|$/.test(l)) return;
        var cells = l.slice(1, -1).split('|').map(function(c) { return c.trim(); });
        var tag = html.filter(function(x) { return x.indexOf('<table>') === 0; }).length && !html.some(function(x) { return x.indexOf('<tr>') === 0; }) ? 'th' : 'td';
        html.push('<tr>' + cells.map(function(c) { return '<' + tag + '>' + inline(c) + '</' + tag + '>'; }).join('') + '</tr>');
        return;
      }
      if (inTable) { html.push('</tbody></table>'); inTable = false; }
      if (/^- /.test(l)) {
        if (!inUl) { html.push('<ul>'); inUl = true; }
        html.push('<li>' + inline(l.slice(2)) + '</li>');
        return;
      }
      if (inUl) { html.push('</ul>'); inUl = false; }
      if (/^# /.test(l)) html.push('<h2>' + inline(l.slice(2)) + '</h2>');
      else if (/^## /.test(l)) html.push('<h4>' + inline(l.slice(3)) + '</h4>');
      else if (/^> /.test(l)) html.push('<p class="rp-meta">' + inline(l.slice(2)) + '</p>');
      else if (/^---$/.test(l)) html.push('<hr style="border:none;border-top:1px solid var(--rule);margin:1rem 0">');
      else if (l.trim()) html.push('<p>' + inline(l) + '</p>');
    });
    if (inTable) html.push('</tbody></table>');
    if (inUl) html.push('</ul>');
    return html.join('');
  }

  var lastReport = null;
  document.getElementById('btn-report').addEventListener('click', function() {
    lastReport = buildReport();
    var img = '';
    try { img = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' }); } catch (e) {}
    var body = mdToHtml(lastReport.md);
    // 在"三、"小节后插入图表
    var marker = '<h4>三、';
    var idx = body.indexOf(marker);
    if (img && idx > 0) {
      var endH = body.indexOf('</h4>', idx);
      body = body.slice(0, endH + 5) + '<img class="rp-chart-img" src="' + img + '" alt="分析图表">' + body.slice(endH + 5);
    }
    document.getElementById('report-body').innerHTML = body;
    document.getElementById('report-panel').classList.add('show');
    document.getElementById('report-panel').scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  document.getElementById('rp-copy').addEventListener('click', function() {
    if (!lastReport) return;
    navigator.clipboard.writeText(lastReport.md).then(function() {
      var b = document.getElementById('rp-copy');
      b.textContent = '已复制 ✓';
      setTimeout(function() { b.textContent = '复制 Markdown'; }, 1500);
    });
  });
  function download(name, content, mime) {
    var blob = content instanceof Blob ? content : new Blob([content], { type: mime });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    a.click();
    URL.revokeObjectURL(a.href);
  }
  document.getElementById('rp-md').addEventListener('click', function() {
    if (!lastReport) return;
    download(lastReport.title + '.md', '﻿' + lastReport.md, 'text/markdown;charset=utf-8');
  });
  document.getElementById('rp-html').addEventListener('click', function() {
    if (!lastReport) return;
    var img = '';
    try { img = chart.getDataURL({ type: 'png', pixelRatio: 2, backgroundColor: '#ffffff' }); } catch (e) {}
    var body = mdToHtml(lastReport.md);
    var marker = '<h4>三、';
    var idx = body.indexOf(marker);
    if (img && idx > 0) {
      var endH = body.indexOf('</h4>', idx);
      body = body.slice(0, endH + 5) + '<img style="max-width:100%;border:1px solid #e7e4dc;border-radius:10px;margin:8px 0 14px" src="' + img + '">' + body.slice(endH + 5);
    }
    var html = '<!-- Generated by Trae Work --><!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">' +
      '<title>' + lastReport.title + '</title><style>' +
      'body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:52rem;margin:2rem auto;padding:0 1.2rem;color:#1b2430;line-height:1.7}' +
      'h2{font-size:1.5rem;font-weight:800;margin:1.6rem 0 .7rem}h4{font-size:1.1rem;font-weight:700;margin:1.3rem 0 .5rem}' +
      'p{font-size:.92rem;color:#4a5568;margin-bottom:.55rem}p b,li b{color:#1b2430}' +
      'ul{padding-left:1.2rem}li{font-size:.92rem;color:#4a5568;margin-bottom:.3rem}' +
      'table{width:100%;border-collapse:collapse;font-size:.85rem;margin:.6rem 0 1rem}th,td{border:1px solid #e7e4dc;padding:.4rem .6rem;text-align:left}th{background:#faf9f5}' +
      '.rp-meta{font-size:.78rem;color:#9aa3b2}hr{border:none;border-top:1px solid #e7e4dc;margin:1rem 0}</style></head><body>' + body + '</body></html>';
    download(lastReport.title + '.html', html, 'text/html;charset=utf-8');
  });

  // ===== 事件绑定 =====
  var deb = S.debounce(refresh, 250);
  document.getElementById('f-region').addEventListener('change', function() { state.region = this.value; refresh(); });
  document.getElementById('f-status').addEventListener('change', function() { state.status = this.value; refresh(); });
  document.getElementById('f-fuel').addEventListener('change', function() { state.fuel = this.value; refresh(); });
  document.getElementById('f-country').addEventListener('input', function() { state.country = this.value; deb(); });
  document.getElementById('f-keyword').addEventListener('input', function() { state.kw = this.value; deb(); });
  document.getElementById('f-reset').addEventListener('click', function() {
    state.region = ''; state.status = ''; state.fuel = ''; state.country = ''; state.kw = '';
    ['f-region', 'f-status', 'f-fuel'].forEach(function(id) { document.getElementById(id).value = ''; });
    document.getElementById('f-country').value = '';
    document.getElementById('f-keyword').value = '';
    refresh();
  });
  document.getElementById('w-dim').addEventListener('change', function() { state.dim = this.value; refresh(); });
  document.getElementById('w-metric').addEventListener('change', function() { state.metric = this.value; refresh(); });
  document.getElementById('w-chart').addEventListener('change', function() { state.chart = this.value; refresh(); });
  document.getElementById('w-dim2').addEventListener('change', function() { state.dim2 = this.value; refresh(); });
  document.getElementById('w-topn').addEventListener('change', function() { state.topn = +this.value; refresh(); });

  refresh();
})();
</script>
