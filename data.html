<script src="assets/site.js?v=2"></script>
<script>
(function() {
  'use strict';
  var S = window.SITE, RAW = window.GOGPT_DATA;

  /* ===== 列定义（k = 数据下标） ===== */
  var COLS = {
    0:  { name: '电厂名称' },
    1:  { name: '机组名称' },
    2:  { name: '国家/地区', fmt: function(r) { return S.cnCountry(r[2]); } },
    3:  { name: '大区' },
    4:  { name: '状态', badge: true },
    5:  { name: '燃料大类' },
    6:  { name: '容量 (MW)', num: true, bar: true },
    7:  { name: '纬度', num: true, hide: true },
    8:  { name: '经度', num: true, hide: true },
    9:  { name: '投运年份', num: true },
    10: { name: '业主' },
    11: { name: 'GEM Wiki', link: true }
  };
  var ORDER = [0, 1, 2, 3, 4, 5, 6, 9, 10, 11, 7, 8];
  var NUMCOLS = [6, 9, 7, 8];

  /* ===== 筛选维度 ===== */
  var regions = [], fuels = [];
  RAW.forEach(function(r) {
    if (regions.indexOf(r[3]) < 0) regions.push(r[3]);
    if (fuels.indexOf(r[5]) < 0) fuels.push(r[5]);
  });
  regions.sort();
  var FDIMS = {
    region: { name: '大区', opts: regions, color: function(v) { return '#0e7c6f'; } },
    status: { name: '状态', opts: S.STATUS_ORDER, color: function(v) { return S.STATUS_COLOR[v] || '#9aa3b2'; } },
    fuel:   { name: '燃料', opts: S.FUEL_ORDER.filter(function(f) { return fuels.indexOf(f) >= 0; }), color: function() { return '#c47a12'; } }
  };

  /* ===== 状态 ===== */
  var qs = new URLSearchParams(location.search);
  var st = {
    q: qs.get('q') || qs.get('kw') || qs.get('country') || '',
    filters: {
      region: qs.get('region') ? qs.get('region').split(',') : [],
      status: qs.get('status') ? qs.get('status').split(',') : [],
      fuel: qs.get('fuel') ? qs.get('fuel').split(',') : []
    },
    sort: null, sortDir: 0,
    page: Math.max(1, +qs.get('page') || 1),
    size: +qs.get('size') || 50,
    expanded: null
  };
  var sp = qs.get('sort');
  if (sp && /^(\d+):(-?1)$/.test(sp)) { st.sort = +sp.split(':')[0]; st.sortDir = +sp.split(':')[1]; }
  var filtered = RAW.slice();

  document.getElementById('db-total').textContent = RAW.length.toLocaleString() + ' 条';
  document.getElementById('db-q').value = st.q;

  /* ===== URL 同步 ===== */
  function syncUrl() {
    var q = new URLSearchParams();
    if (st.q) q.set('q', st.q);
    ['region', 'status', 'fuel'].forEach(function(d) { if (st.filters[d].length) q.set(d, st.filters[d].join(',')); });
    if (st.sort && st.sortDir) q.set('sort', st.sort + ':' + st.sortDir);
    if (st.page > 1) q.set('page', st.page);
    if (st.size !== 50) q.set('size', st.size);
    var s = q.toString();
    history.replaceState(null, '', s ? '?' + s : location.pathname);
  }

  /* ===== 筛选 + 排序 ===== */
  function applyAll() {
    var qq = st.q.trim().toLowerCase();
    filtered = RAW.filter(function(r) {
      if (st.filters.region.length && st.filters.region.indexOf(r[3]) < 0) return false;
      if (st.filters.status.length && st.filters.status.indexOf(r[4]) < 0) return false;
      if (st.filters.fuel.length && st.filters.fuel.indexOf(r[5]) < 0) return false;
      if (qq) {
        var hay = (r[0] + ' ' + r[1] + ' ' + r[10] + ' ' + r[2] + ' ' + S.cnCountry(r[2])).toLowerCase();
        if (hay.indexOf(qq) < 0) return false;
      }
      return true;
    });
    if (st.sort != null && st.sortDir) {
      var c = st.sort, isNum = NUMCOLS.indexOf(c) >= 0;
      filtered.sort(function(a, b) {
        var va = a[c], vb = b[c];
        if (va === vb) return 0;
        if (va == null || va === '') return 1;
        if (vb == null || vb === '') return -1;
        if (isNum) return (va - vb) * st.sortDir;
        return String(va) < String(vb) ? -st.sortDir : st.sortDir;
      });
    }
  }

  /* ===== 表格渲染 ===== */
  function visibleCols() { return ORDER.filter(function(k) { return !COLS[k].hide; }); }

  function renderHead() {
    document.getElementById('thead').innerHTML = visibleCols().map(function(k) {
      var c = COLS[k];
      var arr = st.sort === k && st.sortDir ? '<span class="arr">' + (st.sortDir === 1 ? '▲' : '▼') + '</span>' : '';
      return '<th data-k="' + k + '"' + (c.num ? ' class="num"' : '') + ' title="' + S.esc(c.name) + '">' + S.esc(c.name) + arr + '</th>';
    }).join('');
  }

  function rowHtml(r, maxCap) {
    var rid = r[0] + '|' + r[1];
    var tds = visibleCols().map(function(k) {
      var c = COLS[k], v = r[k];
      if (c.badge) {
        var sc = S.STATUS_COLOR[v] || '#9aa3b2';
        return '<td><span class="badge" style="background:' + sc + '1f;color:' + sc + '">' + v + '</span></td>';
      }
      if (c.bar) {
        var p = maxCap ? Math.max(2, Math.round(v / maxCap * 100)) : 0;
        return '<td class="num"><span class="minibar" style="--p:' + p + '%">' + v.toLocaleString() + '</span></td>';
      }
      if (c.link) return '<td>' + (v ? '<a class="b-wiki" href="' + v + '" target="_blank" rel="noopener">详情 ↗</a>' : '') + '</td>';
      if (c.fmt) return '<td>' + S.esc(c.fmt(r)) + '</td>';
      var txt = v == null ? '' : String(v);
      return '<td' + (c.num ? ' class="num"' : '') + ' title="' + S.esc(txt) + '">' + S.esc(txt) + '</td>';
    }).join('');
    var on = st.expanded === rid ? ' on' : '';
    var html = '<tr class="rrow' + on + '" data-id="' + S.esc(rid) + '">' + tds + '</tr>';
    if (st.expanded === rid) html += detailHtml(r);
    return html;
  }

  function detailHtml(r) {
    var e = S.esc;
    var FIELDS = [
      ['电厂名称', e(r[0])], ['机组名称', e(r[1])], ['国家/地区', e(S.cnCountry(r[2]))], ['大区', e(r[3])],
      ['状态', null], ['燃料大类', e(r[5])], ['容量 (MW)', r[6] ? r[6].toLocaleString() : ''],
      ['投运年份', r[9] || ''], ['业主', e(r[10])],
      ['纬度', r[7] != null ? (+r[7]).toFixed(4) : ''], ['经度', r[8] != null ? (+r[8]).toFixed(4) : ''],
      ['GEM Wiki', r[11] ? '<a href="' + e(r[11]) + '" target="_blank" rel="noopener">在 GEM Wiki 查看机组档案 ↗</a>' : '']
    ];
    var sc = S.STATUS_COLOR[r[4]] || '#9aa3b2';
    var cells = FIELDS.map(function(f) {
      var v = f[0] === '状态' ? '<span class="badge" style="background:' + sc + '1f;color:' + sc + '">' + e(r[4]) + '</span>' : f[1];
      return '<div class="d-item"><div class="dl">' + f[0] + '</div><div class="dv">' + v + '</div></div>';
    }).join('');
    return '<tr class="detail-row"><td colspan="99"><div class="detail-head"><span class="dh-name">' + e(r[0]) + ' · ' + e(r[1]) + '</span></div><div class="detail-grid">' + cells + '</div></td></tr>';
  }

  function renderRows() {
    var total = filtered.length;
    var pages = Math.max(1, Math.ceil(total / st.size));
    if (st.page > pages) st.page = pages;
    var start = (st.page - 1) * st.size;
    var rows = filtered.slice(start, start + st.size);
    var maxCap = 0;
    rows.forEach(function(r) { if (r[6] > maxCap) maxCap = r[6]; });
    var tb = document.getElementById('tbody');
    if (!total) {
      tb.innerHTML = '<tr><td colspan="99"><div class="db-empty"><div class="big">🔍</div>没有符合条件的记录<br>试试放宽筛选条件，或<button class="btn" id="empty-reset" style="margin-left:0.4rem">清除全部筛选</button></div></td></tr>';
      var er = document.getElementById('empty-reset');
      if (er) er.addEventListener('click', clearAll);
    } else {
      tb.innerHTML = rows.map(function(r) { return rowHtml(r, maxCap); }).join('');
    }
    Array.prototype.forEach.call(tb.querySelectorAll('tr.rrow'), function(tr) {
      tr.addEventListener('click', function(e) {
        if (e.target.closest('a')) return;
        var id = tr.getAttribute('data-id');
        st.expanded = st.expanded === id ? null : id;
        renderRows();
      });
    });
  }

  /* ===== 分页器 ===== */
  function pageList(cur, pages) {
    var set = [1, pages, cur - 1, cur, cur + 1];
    var arr = [];
    set.forEach(function(p) { if (p >= 1 && p <= pages && arr.indexOf(p) < 0) arr.push(p); });
    arr.sort(function(a, b) { return a - b; });
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      if (i && arr[i] - arr[i - 1] > 1) out.push('…');
      out.push(arr[i]);
    }
    return out;
  }

  function renderPager() {
    var total = filtered.length;
    var pages = Math.max(1, Math.ceil(total / st.size));
    var from = total ? (st.page - 1) * st.size + 1 : 0;
    var to = Math.min(total, st.page * st.size);
    var nums = pageList(st.page, pages).map(function(p) {
      if (p === '…') return '<span class="pg-dots">…</span>';
      return '<button class="pg-btn' + (p === st.page ? ' on' : '') + '" data-p="' + p + '">' + p + '</button>';
    }).join('');
    document.getElementById('db-pager').innerHTML =
      '<span class="pg-info">第 <b>' + from.toLocaleString() + '–' + to.toLocaleString() + '</b> 条 / 共 <b>' + total.toLocaleString() + '</b> 条' +
      (total !== RAW.length ? '（全库 ' + RAW.length.toLocaleString() + '）' : '') + '</span>' +
      '<button class="pg-btn" data-p="1"' + (st.page <= 1 ? ' disabled' : '') + '>«</button>' +
      '<button class="pg-btn" data-p="' + (st.page - 1) + '"' + (st.page <= 1 ? ' disabled' : '') + '>‹</button>' +
      nums +
      '<button class="pg-btn" data-p="' + (st.page + 1) + '"' + (st.page >= pages ? ' disabled' : '') + '>›</button>' +
      '<button class="pg-btn" data-p="' + pages + '"' + (st.page >= pages ? ' disabled' : '') + '>»</button>' +
      '<span class="jump">跳至 <input type="number" min="1" max="' + pages + '" id="pg-jump"> 页</span>' +
      '<select id="pg-size">' + [25, 50, 100, 200].map(function(n) {
        return '<option value="' + n + '"' + (n === st.size ? ' selected' : '') + '>每页 ' + n + ' 条</option>';
      }).join('') + '</select>';
    Array.prototype.forEach.call(document.querySelectorAll('#db-pager .pg-btn[data-p]'), function(b) {
      b.addEventListener('click', function() {
        var p = +b.getAttribute('data-p');
        if (p >= 1 && p <= pages && p !== st.page) { st.page = p; refresh(); }
      });
    });
    var jp = document.getElementById('pg-jump');
    jp.addEventListener('keydown', function(e) {
      if (e.key === 'Enter') {
        var p = Math.min(pages, Math.max(1, +jp.value || 1));
        if (p !== st.page) { st.page = p; refresh(); }
        jp.blur();
      }
    });
    document.getElementById('pg-size').addEventListener('change', function() {
      st.size = +this.value; st.page = 1; refresh();
    });
  }

  /* ===== 筛选标签片 ===== */
  function renderChips() {
    var el = document.getElementById('db-chips');
    var html = '';
    Object.keys(FDIMS).forEach(function(d) {
      var vals = st.filters[d];
      if (!vals.length) return;
      var def = FDIMS[d];
      html += '<span class="fchip" data-dim="' + d + '">' +
        '<span class="fd">' + def.name + '</span>' +
        '<span class="fv fvc" data-act="edit">' + S.esc(vals.join('、')) + '</span>' +
        '<span class="fx" data-act="del" title="移除">✕</span></span>';
    });
    if (html) html += '<button class="addchip" style="border-style:solid;border-color:var(--rule);background:var(--card);box-shadow:var(--shadow)" data-act="reset">重置</button>';
    html += '<button class="addchip" id="add-filter">+ 筛选</button>';
    if (!html) html = '<button class="addchip" id="add-filter">+ 筛选</button>';
    el.innerHTML = html;
    Array.prototype.forEach.call(el.querySelectorAll('.fchip'), function(chip) {
      chip.querySelector('[data-act=edit]').addEventListener('click', function(e) {
        e.stopPropagation();
        openValuePop(chip.getAttribute('data-dim'), this);
      });
      chip.querySelector('[data-act=del]').addEventListener('click', function(e) {
        e.stopPropagation();
        st.filters[chip.getAttribute('data-dim')] = [];
        st.page = 1; refresh();
      });
    });
    var rst = el.querySelector('[data-act=reset]');
    if (rst) rst.addEventListener('click', clearAll);
    document.getElementById('add-filter').addEventListener('click', function(e) {
      e.stopPropagation();
      openDimPop(this);
    });
  }

  function clearAll() {
    st.filters = { region: [], status: [], fuel: [] };
    st.q = ''; document.getElementById('db-q').value = '';
    st.page = 1; st.expanded = null; refresh();
  }

  /* ===== 弹出面板 ===== */
  var popEl = null;
  function closePop() { if (popEl) { popEl.remove(); popEl = null; } }
  function showPop(anchor, html) {
    closePop();
    popEl = document.createElement('div');
    popEl.className = 'pop';
    popEl.innerHTML = html;
    document.body.appendChild(popEl);
    var r = anchor.getBoundingClientRect();
    var w = popEl.offsetWidth, h = popEl.offsetHeight;
    var x = Math.min(r.left, window.innerWidth - w - 12);
    var y = r.bottom + 6;
    if (y + h > window.innerHeight - 10) y = Math.max(10, r.top - h - 6);
    popEl.style.left = Math.max(10, x) + 'px';
    popEl.style.top = y + 'px';
    popEl.addEventListener('click', function(e) { e.stopPropagation(); });
  }

  function openDimPop(anchor) {
    var html = '<h5>添加筛选维度</h5>' + Object.keys(FDIMS).filter(function(d) { return !st.filters[d].length; }).map(function(d) {
      return '<div class="pop-item" data-dim="' + d + '"><span class="sw" style="background:' + FDIMS[d].color('') + '"></span>' + FDIMS[d].name + '</div>';
    }).join('');
    if (html === '<h5>添加筛选维度</h5>') html += '<div class="pop-item" style="color:var(--muted)">所有维度均已添加</div>';
    showPop(anchor, html);
    Array.prototype.forEach.call(popEl.querySelectorAll('[data-dim]'), function(item) {
      item.addEventListener('click', function() {
        openValuePop(item.getAttribute('data-dim'), anchor);
      });
    });
  }

  function openValuePop(dim, anchor) {
    var def = FDIMS[dim];
    function build() {
      return '<h5>选择' + def.name + '（可多选）</h5>' + def.opts.map(function(v) {
        var ck = st.filters[dim].indexOf(v) >= 0 ? ' checked' : '';
        return '<label class="pop-item" data-v="' + S.esc(v) + '"><input type="checkbox"' + ck + '><span class="sw" style="background:' + def.color(v) + '"></span>' + S.esc(v) + '</label>';
      }).join('') +
      '<div class="pop-foot"><button data-a="all">全选</button><button data-a="clear">清空</button><button data-a="done">完成</button></div>';
    }
    showPop(anchor, build());
    function sync() { st.page = 1; refresh(); }
    popEl.addEventListener('change', function(e) {
      var lab = e.target.closest('.pop-item');
      if (!lab) return;
      var v = lab.getAttribute('data-v'), i = st.filters[dim].indexOf(v);
      if (e.target.checked && i < 0) st.filters[dim].push(v);
      if (!e.target.checked && i >= 0) st.filters[dim].splice(i, 1);
      sync();
    });
    popEl.addEventListener('click', function(e) {
      var a = e.target.getAttribute && e.target.getAttribute('data-a');
      if (!a) return;
      if (a === 'all') { st.filters[dim] = def.opts.slice(); sync(); popEl.innerHTML = build(); }
      if (a === 'clear') { st.filters[dim] = []; sync(); popEl.innerHTML = build(); }
      if (a === 'done') { closePop(); }
    });
  }

  function openColsPop(anchor) {
    function build() {
      return '<h5>列设置（勾选显示 · 箭头调序）</h5>' + ORDER.map(function(k, i) {
        var c = COLS[k];
        return '<div class="pop-item"><input type="checkbox" data-k="' + k + '"' + (c.hide ? '' : ' checked') + '><span>' + S.esc(c.name) + '</span>' +
          '<span class="px"><button data-mv="-1" data-i="' + i + '"' + (i === 0 ? ' disabled' : '') + '>↑</button><button data-mv="1" data-i="' + i + '"' + (i === ORDER.length - 1 ? ' disabled' : '') + '>↓</button></span></div>';
      }).join('');
    }
    showPop(anchor, build());
    popEl.addEventListener('change', function(e) {
      var k = e.target.getAttribute && e.target.getAttribute('data-k');
      if (k != null) {
        COLS[k].hide = !e.target.checked;
        renderHead(); renderRows();
      }
    });
    popEl.addEventListener('click', function(e) {
      var mv = e.target.getAttribute && e.target.getAttribute('data-mv');
      if (!mv) return;
      var i = +e.target.getAttribute('data-i'), j = i + (+mv);
      if (j < 0 || j >= ORDER.length) return;
      var t = ORDER[i]; ORDER[i] = ORDER[j]; ORDER[j] = t;
      popEl.innerHTML = build();
      renderHead(); renderRows();
    });
  }

  /* ===== 字段字典抽屉 ===== */
  var DICT = [
    ['电厂名称 / 机组名称', 'GEM 登记的电厂与机组名称（英文）'],
    ['国家/地区 · 大区 · 省/州 · 城市', '电厂所在地理位置；大区分为亚洲/美洲/欧洲/非洲/大洋洲'],
    ['状态', '在运 / 在建 / 前期开发 / 已宣布 / 搁置 / 取消 / 封存 / 退役（译自 GEM 8 级状态）'],
    ['燃料大类', '由 GEM 燃料明细派生：天然气 / 油气混合 / 燃油 / 工业副产气 / 掺氢/其他'],
    ['容量MW', '机组额定装机容量，单位兆瓦'],
    ['投运年份 / 退役年份', '机组投运与退役年份；部分老机组年份缺失'],
    ['技术类型', '燃机技术（如联合循环 GTCC、简单循环等）'],
    ['业主 / 运营商 / 母公司', '项目股权与运营主体'],
    ['纬度 / 经度', 'WGS84 坐标；地图页据此上图'],
    ['GEM Wiki链接', '每条机组在 GEM Wiki 的详情页']
  ];
  document.getElementById('dict-body').innerHTML = DICT.map(function(d) {
    return '<div class="dd-item"><b>' + d[0] + '</b><p>' + d[1] + '</p></div>';
  }).join('');
  var drawer = document.getElementById('dict-drawer'), dmask = document.getElementById('dict-mask');
  document.getElementById('btn-dict').addEventListener('click', function() { drawer.classList.add('open'); dmask.classList.add('show'); });
  function closeDrawer() { drawer.classList.remove('open'); dmask.classList.remove('show'); }
  document.getElementById('dict-close').addEventListener('click', closeDrawer);
  dmask.addEventListener('click', closeDrawer);

  /* ===== 事件绑定 ===== */
  document.getElementById('thead').addEventListener('click', function(e) {
    var th = e.target.closest('th');
    if (!th) return;
    var k = +th.getAttribute('data-k');
    if (st.sort === k) { st.sortDir = st.sortDir === 1 ? -1 : (st.sortDir === -1 ? 0 : 1); if (!st.sortDir) st.sort = null; }
    else { st.sort = k; st.sortDir = NUMCOLS.indexOf(k) >= 0 ? -1 : 1; }
    refresh();
  });

  var debSearch = S.debounce(function() { st.q = document.getElementById('db-q').value; st.page = 1; refresh(); }, 250);
  document.getElementById('db-q').addEventListener('input', debSearch);

  document.getElementById('btn-cols').addEventListener('click', function(e) {
    e.stopPropagation();
    var anchor = this;
    if (popEl && popEl.dataset.kind === 'cols') return closePop();
    openColsPop(anchor);
    popEl.dataset.kind = 'cols';
  });

  document.getElementById('btn-export').addEventListener('click', function() {
    var header = ['电厂名称', '机组名称', '国家/地区', '大区', '状态', '燃料大类', '容量MW', '投运年份', '业主', 'GEM Wiki链接'];
    function csvCell(v) {
      v = String(v == null ? '' : v);
      return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v;
    }
    var lines = [header.join(',')];
    filtered.forEach(function(r) {
      lines.push([r[0], r[1], r[2], r[3], r[4], r[5], r[6], r[9] || '', r[10], r[11] || ''].map(csvCell).join(','));
    });
    var blob = new Blob(['\ufeff' + lines.join('\n')], { type: 'text/csv;charset=utf-8' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'gogpt-' + S.VERSION + '-筛选导出.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  document.addEventListener('click', function(e) {
    if (popEl && !popEl.contains(e.target)) {
      var inChip = e.target.closest && e.target.closest('.fchip, #add-filter, #btn-cols');
      if (!inChip) closePop();
    }
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) {
      e.preventDefault();
      document.getElementById('db-q').focus();
    }
    if (e.key === 'Escape') { closePop(); closeDrawer(); }
  });

  /* ===== 刷新 ===== */
  function refresh() {
    applyAll();
    renderChips();
    renderHead();
    renderRows();
    renderPager();
    syncUrl();
  }
  refresh();
})();
</script>
</body>
</html>
