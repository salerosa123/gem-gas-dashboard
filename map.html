<!-- Generated by Trae Work -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>全球地图 · GOGPT 数据观察站</title>
<meta name="description" content="全球 13,895 台油气发电机组逐一上图：按状态着色、按容量定大小，支持搜索定位、排行联动与全屏浏览。">
<link rel="stylesheet" href="assets/layout.css?v=3">
</head>
<body>
<div class="wrap" style="padding-top:1.2rem">

<div class="map-tb">
  <div class="map-title">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
    全球机组地图
  </div>
  <div class="chips" id="status-chips"></div>
  <span style="flex:1"></span>
  <select id="f-region" class="map-select"><option value="">全部大区</option></select>
  <select id="f-fuel" class="map-select"><option value="">全部燃料</option></select>
  <div class="map-search">
    <span class="ic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></span>
    <input type="text" id="cty-search" placeholder="搜索国家定位（中/英）…" autocomplete="off">
    <div class="map-sug" id="cty-sug"></div>
  </div>
  <button class="reset" id="f-reset" style="background:transparent;color:var(--muted);border:1px dashed var(--rule);border-radius:8px;padding:0.4rem 0.85rem;font-size:0.8rem;cursor:pointer">重置</button>
</div>

<div class="map-kpis" id="map-kpis"></div>

<div class="map-layout">
  <div class="map-panel" id="map-panel">
    <div id="chart-map"></div>
    <div class="map-ctl">
      <button id="btn-home" title="复位视角"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg></button>
      <button id="btn-fs" title="全屏"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/></svg></button>
    </div>
    <div class="detail-card" id="detail-card">
      <button class="dc-close" id="dc-close">×</button>
      <h4 id="dc-name"></h4>
      <div class="dc-sub" id="dc-sub"></div>
      <div class="dc-grid" id="dc-grid"></div>
      <a class="dc-link" id="dc-link" target="_blank" rel="noopener" style="display:none">GEM Wiki 详情 →</a>
    </div>
  </div>
  <aside class="side-panel">
    <h3>国家/地区排行</h3>
    <div class="sub" id="side-sub"></div>
    <div class="seg" id="rank-seg">
      <button data-m="cap" class="on">装机 GW</button>
      <button data-m="units">机组数</button>
      <button data-m="plants">电厂数</button>
    </div>
    <div id="rank-list"></div>
    <div class="map-note">点击排行或搜索国家可在地图上定位；点大小对应装机容量，颜色对应状态；开发中项目带涟漪动效。滚轮/双指缩放，拖拽平移。</div>
  </aside>
</div>

</div>
<script src="./_shared/js/echarts.min.js"></script>
<script src="assets/world.js"></script>
<script src="assets/data.js"></script>
<script src="assets/site.js?v=2"></script>
<script>
(function() {
  'use strict';
  var S = window.SITE, RAW = window.GOGPT_DATA;
  var params = S.getParams();
  var state = {
    statuses: params.status.length ? params.status.slice() : S.STATUS_ORDER.slice(),
    region: params.region, fuel: params.fuel, country: params.country || '',
    metric: 'cap'
  };
  var DEF_VIEW = { center: [12, 22], zoom: 1.18 };
  var curView = { center: DEF_VIEW.center.slice(), zoom: DEF_VIEW.zoom };

  /* ===== 国家索引（搜索建议 + 定位） ===== */
  var CTY = {};
  RAW.forEach(function(r) {
    if (!r[7] || !r[8]) return;
    var c = CTY[r[2]];
    if (!c) c = CTY[r[2]] = { en: r[2], cn: S.cnCountry(r[2]), units: 0, lngs: [], lats: [] };
    c.units++;
    if (c.lngs.length < 400) { c.lngs.push(r[8]); c.lats.push(r[7]); }
  });
  function ctyView(en) {
    var c = CTY[en]; if (!c) return null;
    var span = function(a) { return Math.max.apply(null, a) - Math.min.apply(null, a); };
    var sl = span(c.lngs), st = span(c.lats);
    var s = Math.max(sl, st * 1.6);
    var zoom = s < 6 ? 7 : s < 14 ? 5.5 : s < 30 ? 4 : s < 60 ? 3 : 2.2;
    return {
      center: [(Math.min.apply(null, c.lngs) + Math.max.apply(null, c.lngs)) / 2,
               (Math.min.apply(null, c.lats) + Math.max.apply(null, c.lats)) / 2],
      zoom: zoom
    };
  }

  /* ===== 筛选控件 ===== */
  var chipsEl = document.getElementById('status-chips');
  var rfFiltered = RAW; // 仅大区/燃料（供 chips 计数，与状态筛选无关）
  function baseFiltered() {
    return RAW.filter(function(r) {
      if (state.region && r[3] !== state.region) return false;
      if (state.fuel && r[5] !== state.fuel) return false;
      return true;
    });
  }
  function renderChips() {
    var cnt = {};
    rfFiltered.forEach(function(r) { cnt[r[4]] = (cnt[r[4]] || 0) + 1; });
    chipsEl.innerHTML = S.STATUS_ORDER.map(function(st) {
      var on = state.statuses.indexOf(st) >= 0;
      return '<span class="chip' + (on ? ' on' : '') + '" data-st="' + st + '">' +
        '<span class="dot" style="--dot:' + S.STATUS_COLOR[st] + '"></span>' + st +
        '<span class="n">' + (cnt[st] || 0).toLocaleString() + '</span></span>';
    }).join('');
    Array.prototype.forEach.call(chipsEl.querySelectorAll('.chip'), function(el) {
      el.addEventListener('click', function() {
        var st = el.getAttribute('data-st');
        var i = state.statuses.indexOf(st);
        if (i >= 0) { if (state.statuses.length > 1) state.statuses.splice(i, 1); }
        else state.statuses.push(st);
        applyFilter();
      });
    });
  }
  function fillSelect(id, values) {
    var sel = document.getElementById(id);
    values.forEach(function(v) {
      var o = document.createElement('option'); o.value = v; o.textContent = v; sel.appendChild(o);
    });
  }
  var regions = [], fuels = [];
  RAW.forEach(function(r) {
    if (regions.indexOf(r[3]) < 0) regions.push(r[3]);
    if (fuels.indexOf(r[5]) < 0) fuels.push(r[5]);
  });
  fillSelect('f-region', regions.sort());
  fillSelect('f-fuel', S.FUEL_ORDER.filter(function(f) { return fuels.indexOf(f) >= 0; }));
  if (state.region) document.getElementById('f-region').value = state.region;
  if (state.fuel) document.getElementById('f-fuel').value = state.fuel;
  document.getElementById('f-region').addEventListener('change', function() { state.region = this.value; applyFilter(); });
  document.getElementById('f-fuel').addEventListener('change', function() { state.fuel = this.value; applyFilter(); });
  document.getElementById('f-reset').addEventListener('click', function() {
    state = { statuses: S.STATUS_ORDER.slice(), region: '', fuel: '', country: '', metric: state.metric };
    document.getElementById('f-region').value = '';
    document.getElementById('f-fuel').value = '';
    document.getElementById('cty-search').value = '';
    homeView();
    applyFilter();
  });

  /* ===== KPI ===== */
  function renderKpis(rows) {
    var plants = {}, ctrys = {}, cap = 0, opCap = 0;
    rows.forEach(function(r) {
      plants[r[0]] = 1; ctrys[r[2]] = 1; cap += r[6];
      if (r[4] === '在运') opCap += r[6];
    });
    var items = [
      ['机组', rows.length.toLocaleString(), '台'],
      ['总装机', (cap / 1000).toFixed(1), 'GW'],
      ['覆盖国家/地区', Object.keys(ctrys).length, ''],
      ['在运装机占比', cap ? (opCap / cap * 100).toFixed(0) : '0', '%']
    ];
    document.getElementById('map-kpis').innerHTML = items.map(function(it) {
      return '<div class="mkpi"><span class="ml">' + it[0] + '</span><span class="mv">' + it[1] + '</span>' + (it[2] ? '<span class="mu">' + it[2] + '</span>' : '') + '</div>';
    }).join('');
  }

  /* ===== 地图 ===== */
  echarts.registerMap('world', window.WORLD_GEOJSON);
  var map = echarts.init(document.getElementById('chart-map'));
  var resizeT = null;
  window.addEventListener('resize', function() { clearTimeout(resizeT); resizeT = setTimeout(function() { map.resize(); }, 120); });
  document.addEventListener('fullscreenchange', function() { setTimeout(function() { map.resize(); }, 80); });
  var filtered = RAW;

  function renderMap() {
    var series = S.STATUS_ORDER.filter(function(st) { return state.statuses.indexOf(st) >= 0; })
      .map(function(st) {
        var pts = [];
        filtered.forEach(function(r) {
          if (r[4] === st && r[7] && r[8]) pts.push({ name: r[0], value: [r[8], r[7], r[6]], row: r });
        });
        pts.sort(function(a, b) { return a.value[2] - b.value[2]; }); // 小点先渲染，大点在上层
        var isDev = S.DEV_STATUSES.indexOf(st) >= 0;
        var base = {
          name: st, type: isDev ? 'effectScatter' : 'scatter', coordinateSystem: 'geo', data: pts,
          symbolSize: function(v) { return Math.max(3, Math.min(28, Math.sqrt(v[2]) / 2.2)); },
          itemStyle: { color: S.STATUS_COLOR[st], opacity: 0.85, borderColor: '#ffffff', borderWidth: 0.8,
            shadowBlur: 3, shadowColor: 'rgba(27,36,48,.25)' },
          emphasis: { itemStyle: { opacity: 1 }, scale: 1.35 },
          z: isDev ? 4 : 3
        };
        if (isDev) base.rippleEffect = { brushType: 'stroke', scale: 3.2, period: 4.5 };
        return base;
      });
    map.setOption({
      animation: true, animationDurationUpdate: 600, animationEasingUpdate: 'cubicInOut',
      backgroundColor: '#d9e5ea',
      tooltip: Object.assign({}, S.EC.tooltip, {
        formatter: function(p) {
          var r = p.data.row;
          return '<b>' + r[0] + '</b> · ' + r[1] + '<br/>' + S.cnCountry(r[2]) + ' · ' + r[4] +
            '<br/>容量 ' + r[6].toLocaleString() + ' MW · ' + r[5] + (r[9] ? '<br/>投运 ' + r[9] : '');
        }
      }),
      legend: { show: false },
      geo: {
        map: 'world', roam: true, zoom: curView.zoom, center: curView.center,
        top: 14, bottom: 14, left: 14, right: 14,
        scaleLimit: { min: 0.9, max: 14 },
        itemStyle: { areaColor: '#e9e6dd', borderColor: '#ffffff', borderWidth: 0.7 },
        emphasis: { itemStyle: { areaColor: '#e3e8e2', borderColor: '#9fb8ad', borderWidth: 1 }, label: { show: false } },
        select: { disabled: true }
      },
      series: series
    }, { notMerge: true });
  }
  map.on('georoam', function() {
    var opt = map.getOption();
    if (opt.geo && opt.geo[0]) curView = { center: opt.geo[0].center, zoom: opt.geo[0].zoom };
  });

  function flyTo(view) {
    curView = { center: view.center.slice(), zoom: view.zoom };
    map.setOption({ geo: { center: curView.center, zoom: curView.zoom } });
  }
  function homeView() { flyTo(DEF_VIEW); }
  document.getElementById('btn-home').addEventListener('click', homeView);
  document.getElementById('btn-fs').addEventListener('click', function() {
    var p = document.getElementById('map-panel');
    if (document.fullscreenElement) document.exitFullscreen();
    else if (p.requestFullscreen) p.requestFullscreen();
  });

  /* ===== 点击散点 → 详情卡 ===== */
  map.on('click', function(p) {
    if (!p.data || !p.data.row) return;
    var r = p.data.row, e = S.esc;
    document.getElementById('dc-name').textContent = r[0];
    document.getElementById('dc-sub').textContent = S.cnCountry(r[2]) + ' · ' + r[3] + ' · 机组 ' + r[1];
    var stColor = S.STATUS_COLOR[r[4]] || '#9aa3b2';
    document.getElementById('dc-grid').innerHTML =
      '<div class="k">状态</div><div class="v"><span class="badge" style="background:' + stColor + '1f;color:' + stColor + '">' + r[4] + '</span></div>' +
      '<div class="k">容量</div><div class="v">' + r[6].toLocaleString() + ' MW</div>' +
      '<div class="k">燃料</div><div class="v">' + e(r[5]) + '</div>' +
      '<div class="k">投运年份</div><div class="v">' + (r[9] || '—') + '</div>' +
      '<div class="k">业主</div><div class="v" style="font-family:inherit">' + (r[10] ? e(r[10]) : '—') + '</div>' +
      '<div class="k">坐标</div><div class="v">' + (+r[7]).toFixed(2) + ', ' + (+r[8]).toFixed(2) + '</div>';
    var link = document.getElementById('dc-link');
    if (r[11]) { link.href = r[11]; link.style.display = 'inline-block'; }
    else link.style.display = 'none';
    document.getElementById('detail-card').classList.add('show');
  });
  document.getElementById('dc-close').addEventListener('click', function() {
    document.getElementById('detail-card').classList.remove('show');
  });

  /* ===== 搜索定位 ===== */
  var sugEl = document.getElementById('cty-sug'), qEl = document.getElementById('cty-search');
  function sugMatches(q) {
    q = q.trim().toLowerCase();
    if (!q) return [];
    var out = [];
    Object.keys(CTY).forEach(function(en) {
      var c = CTY[en];
      if (en.toLowerCase().indexOf(q) >= 0 || c.cn.toLowerCase().indexOf(q) >= 0) out.push(c);
    });
    out.sort(function(a, b) { return b.units - a.units; });
    return out.slice(0, 8);
  }
  qEl.addEventListener('input', function() {
    var ms = sugMatches(qEl.value);
    if (!ms.length) { sugEl.classList.remove('show'); return; }
    sugEl.innerHTML = ms.map(function(c, i) {
      return '<div class="sg-item' + (i === 0 ? ' sel' : '') + '" data-en="' + S.esc(c.en) + '"><span>' + S.esc(c.cn) + ' <span style="color:var(--faint);font-size:0.74rem">' + S.esc(c.en) + '</span></span><span class="sg-n">' + c.units.toLocaleString() + ' 台</span></div>';
    }).join('');
    sugEl.classList.add('show');
    Array.prototype.forEach.call(sugEl.querySelectorAll('.sg-item'), function(el) {
      el.addEventListener('mousedown', function(ev) { ev.preventDefault(); pickCty(el.getAttribute('data-en')); });
    });
  });
  qEl.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    var sel = sugEl.querySelector('.sg-item.sel');
    if (sel) pickCty(sel.getAttribute('data-en'));
  });
  qEl.addEventListener('blur', function() { setTimeout(function() { sugEl.classList.remove('show'); }, 180); });
  function pickCty(en) {
    state.country = en;
    qEl.value = CTY[en] ? CTY[en].cn : en;
    sugEl.classList.remove('show');
    applyFilter();
    var v = ctyView(en);
    if (v) flyTo(v);
  }

  /* ===== 侧栏排行 ===== */
  var METRIC_LABEL = { cap: '装机 GW', units: '机组数', plants: '电厂数' };
  function rankData(rows) {
    var m = {};
    rows.forEach(function(r) {
      var g = m[r[2]] || (m[r[2]] = { cap: 0, units: 0, plants: {} });
      g.cap += r[6]; g.units++; g.plants[r[0]] = 1;
    });
    return Object.keys(m).map(function(k) {
      return { name: k, cap: m[k].cap / 1000, units: m[k].units, plants: Object.keys(m[k].plants).length };
    });
  }
  function renderRank() {
    var all = rankData(filtered).sort(function(a, b) { return b[state.metric] - a[state.metric]; });
    var top = all.slice(0, 15);
    var total = all.reduce(function(s, d) { return s + d[state.metric]; }, 0) || 1;
    var max = top.length ? top[0][state.metric] : 1;
    var fmt = function(v) { return state.metric === 'cap' ? v.toFixed(1) : v.toLocaleString(); };
    document.getElementById('rank-list').innerHTML = top.map(function(d, i) {
      return '<div class="rank-row' + (state.country === d.name ? ' on-cty' : '') + '" data-cty="' + S.esc(d.name) + '">' +
        '<span class="rank-i">' + (i + 1) + '</span>' +
        '<span class="rank-name">' + S.esc(S.cnCountry(d.name)) + '</span>' +
        '<span class="rank-bar"><i style="width:' + Math.max(4, d[state.metric] / max * 100).toFixed(0) + '%"></i></span>' +
        '<span class="rank-pct">' + (d[state.metric] / total * 100).toFixed(0) + '%</span>' +
        '<span class="rank-val">' + fmt(d[state.metric]) + '</span></div>';
    }).join('') || '<div class="rank-empty">无匹配数据</div>';
    Array.prototype.forEach.call(document.querySelectorAll('.rank-row'), function(el) {
      el.addEventListener('click', function() { pickCty(el.getAttribute('data-cty')); });
    });
    document.getElementById('side-sub').textContent =
      '按' + METRIC_LABEL[state.metric] + '排序 · ' + filtered.length.toLocaleString() + ' 台机组';
  }
  Array.prototype.forEach.call(document.querySelectorAll('#rank-seg button'), function(btn) {
    btn.addEventListener('click', function() {
      state.metric = btn.getAttribute('data-m');
      Array.prototype.forEach.call(document.querySelectorAll('#rank-seg button'), function(b) { b.classList.remove('on'); });
      btn.classList.add('on');
      renderRank();
    });
  });

  /* ===== URL 同步 + 主流程 ===== */
  function syncUrl() {
    var q = new URLSearchParams();
    if (state.statuses.length && state.statuses.length !== S.STATUS_ORDER.length) q.set('status', state.statuses.join(','));
    if (state.region) q.set('region', state.region);
    if (state.fuel) q.set('fuel', state.fuel);
    if (state.country) q.set('country', state.country);
    var s = q.toString();
    history.replaceState(null, '', s ? '?' + s : location.pathname);
  }
  function applyFilter() {
    rfFiltered = baseFiltered();
    filtered = S.filterRows(rfFiltered, { status: state.statuses, country: '', kw: '' });
    if (state.country) filtered = filtered.filter(function(r) { return r[2] === state.country; });
    renderChips(); renderKpis(filtered); renderMap(); renderRank(); syncUrl();
  }
  applyFilter();
  if (state.country) {
    qEl.value = CTY[state.country] ? CTY[state.country].cn : state.country;
    var v0 = ctyView(state.country);
    if (v0) curView = { center: v0.center.slice(), zoom: v0.zoom };
    renderMap();
  }
})();
</script>
</body>
</html>
