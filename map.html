<script>
(function() {
  'use strict';
  var S = window.SITE, RAW = window.GOGPT_DATA;
  var params = S.getParams();
  var state = {
    statuses: params.status.filter(function(st) { return S.STATUS_ORDER.indexOf(st) >= 0; }),
    regions: [], fuels: [], country: params.country || '',
    yearMin: 0, yearMax: 0
  };

  /* ===== 候选项 ===== */
  var regionCnt = {}, fuelCnt = {};
  RAW.forEach(function(r) {
    regionCnt[r[3]] = (regionCnt[r[3]] || 0) + 1;
    fuelCnt[r[5]] = (fuelCnt[r[5]] || 0) + 1;
  });
  var REGION_ITEMS = Object.keys(regionCnt).sort().map(function(v) { return { v: v, label: v, n: regionCnt[v] }; });
  var FUEL_ITEMS = S.FUEL_ORDER.filter(function(f) { return fuelCnt[f]; }).map(function(f) { return { v: f, label: f, n: fuelCnt[f] }; });
  var STATUS_ITEMS = S.STATUS_ORDER.map(function(st) { return { v: st, label: st, n: (S.filterRows(RAW, { status: [st] })).length, color: S.STATUS_COLOR[st] }; });
  if (params.region) {
    var rs = params.region.split(',').filter(function(v) { return regionCnt[v]; });
    if (rs.length && rs.length !== REGION_ITEMS.length) state.regions = rs;
  }
  if (params.fuel) {
    var fs = params.fuel.split(',').filter(function(v) { return fuelCnt[v]; });
    if (fs.length && fs.length !== FUEL_ITEMS.length) state.fuels = fs;
  }

  /* ===== 多选下拉组件 ===== */
  var CHEV = '<svg class="msel-chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>';
  var CHECK = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
  var mselInstances = [];
  function closeAllMsel() { mselInstances.forEach(function(m) { m.close(); }); }
  function createMsel(mountId, title, items, initial, onChange) {
    var root = document.getElementById(mountId);
    var sel = initial.slice();
    root.innerHTML =
      '<button type="button" class="msel-btn"><span class="msel-t">' + title + '</span><span class="msel-sum"></span>' + CHEV + '</button>' +
      '<div class="msel-panel"><div class="ms-list"></div>' +
      '<div class="ms-foot"><button type="button" data-a="all">全选</button><span style="flex:1"></span><button type="button" data-a="clear">清空</button></div></div>';
    var btn = root.querySelector('.msel-btn'), list = root.querySelector('.ms-list'), sum = root.querySelector('.msel-sum');
    function isAll() { return sel.length === 0 || sel.length === items.length; }
    function renderSum() {
      if (isAll()) { sum.textContent = '全部'; root.classList.remove('has-sel'); return; }
      var names = sel.map(function(v) {
        for (var i = 0; i < items.length; i++) if (items[i].v === v) return items[i].label;
        return v;
      });
      var t = names.slice(0, 2).join('、');
      if (names.length > 2) t += ' +' + (names.length - 2);
      sum.textContent = t; root.classList.add('has-sel');
    }
    function renderList() {
      list.innerHTML = items.map(function(it) {
        var on = sel.indexOf(it.v) >= 0;
        return '<div class="ms-item' + (on ? ' on' : '') + '" data-v="' + S.esc(it.v) + '">' +
          (it.color ? '<span class="ms-dot" style="--dot:' + it.color + '"></span>' : '') +
          '<span class="ms-name">' + S.esc(it.label) + '</span>' +
          '<span class="ms-n">' + it.n.toLocaleString() + '</span>' +
          '<span class="ms-ck">' + CHECK + '</span></div>';
      }).join('');
      Array.prototype.forEach.call(list.querySelectorAll('.ms-item'), function(el) {
        el.addEventListener('click', function(e) {
          e.stopPropagation();
          var v = el.getAttribute('data-v'), i = sel.indexOf(v);
          if (i >= 0) sel.splice(i, 1); else sel.push(v);
          renderList(); renderSum(); onChange(sel.slice());
        });
      });
    }
    btn.addEventListener('click', function(e) {
      e.stopPropagation();
      var open = root.classList.contains('open');
      closeAllMsel();
      if (!open) root.classList.add('open');
    });
    Array.prototype.forEach.call(root.querySelectorAll('.ms-foot button'), function(b) {
      b.addEventListener('click', function(e) {
        e.stopPropagation();
        sel = b.getAttribute('data-a') === 'all' ? items.map(function(it) { return it.v; }) : [];
        renderList(); renderSum(); onChange(sel.slice());
      });
    });
    var api = {
      get: function() { return sel.slice(); },
      set: function(arr) { sel = arr.slice(); renderList(); renderSum(); },
      close: function() { root.classList.remove('open'); }
    };
    mselInstances.push(api);
    renderList(); renderSum();
    return api;
  }
  var mStatus = createMsel('ms-status', '状态', STATUS_ITEMS, state.statuses, function(v) { state.statuses = v; applyFilter(); });
  var mRegion = createMsel('ms-region', '大区', REGION_ITEMS, state.regions, function(v) { state.regions = v; applyFilter(); });
  var mFuel = createMsel('ms-fuel', '燃料', FUEL_ITEMS, state.fuels, function(v) { state.fuels = v; applyFilter(); });
  document.addEventListener('click', closeAllMsel);
  document.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeAllMsel(); });
  document.getElementById('f-reset').addEventListener('click', function() {
    state = { statuses: [], regions: [], fuels: [], country: '', yearMin: 0, yearMax: 0 };
    mStatus.set([]); mRegion.set([]); mFuel.set([]);
    document.getElementById('cty-search').value = '';
    hideAiNote();
    homeView(); applyFilter();
  });

  /* ===== 国家索引（搜索建议 + 定位） ===== */
  var CTY = {};
  RAW.forEach(function(r) {
    if (!r[7] || !r[8]) return;
    var c = CTY[r[2]];
    if (!c) c = CTY[r[2]] = { en: r[2], cn: S.cnCountry(r[2]), units: 0, lngs: [], lats: [] };
    c.units++;
    if (c.lngs.length < 400) { c.lngs.push(r[8]); c.lats.push(r[7]); }
  });
  function ctyView(en) {
    var c = CTY[en]; if (!c) return null;
    var span = function(a) { return Math.max.apply(null, a) - Math.min.apply(null, a); };
    var s = Math.max(span(c.lngs), span(c.lats) * 1.6);
    var zoom = s < 6 ? 7 : s < 14 ? 5.5 : s < 30 ? 4 : s < 60 ? 3 : 2.2;
    return {
      center: [(Math.min.apply(null, c.lngs) + Math.max.apply(null, c.lngs)) / 2,
               (Math.min.apply(null, c.lats) + Math.max.apply(null, c.lats)) / 2],
      zoom: zoom
    };
  }

  /* ===== 地图 ===== */
  echarts.registerMap('world', window.WORLD_GEOJSON);
  var map = echarts.init(document.getElementById('chart-map'));
  var resizeT = null;
  window.addEventListener('resize', function() { clearTimeout(resizeT); resizeT = setTimeout(function() { map.resize(); }, 120); });
  document.addEventListener('fullscreenchange', function() { setTimeout(function() { map.resize(); }, 80); });
  var filtered = RAW;
  var DEF_VIEW = { center: [12, 22], zoom: 1.18 };
  var curView = { center: DEF_VIEW.center.slice(), zoom: DEF_VIEW.zoom };

  function renderMap() {
    var series = S.STATUS_ORDER.map(function(st) {
      var pts = [];
      filtered.forEach(function(r) {
        if (r[4] === st && r[7] && r[8]) pts.push({ name: r[0], value: [r[8], r[7], r[6]], row: r });
      });
      pts.sort(function(a, b) { return a.value[2] - b.value[2]; }); // 小点先渲染，大点在上层
      return {
        name: st, type: 'scatter', coordinateSystem: 'geo', data: pts,
        symbolSize: function(v) { return Math.max(3, Math.min(26, Math.sqrt(v[2]) / 2.3)); },
        itemStyle: { color: S.STATUS_COLOR[st], opacity: 0.85, borderColor: '#ffffff', borderWidth: 0.8 },
        emphasis: { itemStyle: { opacity: 1 } },
        z: 3
      };
    });
    map.setOption({
      animation: false,
      backgroundColor: '#d9e5ea',
      tooltip: Object.assign({}, S.EC.tooltip, {
        formatter: function(p) {
          var r = p.data.row;
          return '<b>' + r[0] + '</b> · ' + r[1] + '<br/>' + S.cnCountry(r[2]) + ' · ' + r[4] +
            '<br/>容量 ' + r[6].toLocaleString() + ' MW · ' + r[5] + (r[9] ? '<br/>投运 ' + r[9] : '');
        }
      }),
      legend: { show: false },
      geo: {
        map: 'world', roam: true, zoom: curView.zoom, center: curView.center,
        top: 14, bottom: 14, left: 14, right: 14,
        scaleLimit: { min: 0.9, max: 14 },
        itemStyle: { areaColor: '#e9e6dd', borderColor: '#ffffff', borderWidth: 0.7 },
        emphasis: { itemStyle: { areaColor: '#e3e8e2', borderColor: '#9fb8ad', borderWidth: 1 }, label: { show: false } },
        select: { disabled: true }
      },
      series: series
    }, { notMerge: true });
  }
  map.on('georoam', function() {
    var opt = map.getOption();
    if (opt.geo && opt.geo[0]) curView = { center: opt.geo[0].center, zoom: opt.geo[0].zoom };
  });
  function flyTo(view) {
    curView = { center: view.center.slice(), zoom: view.zoom };
    map.setOption({ geo: { center: curView.center, zoom: curView.zoom } });
  }
  function homeView() { flyTo(DEF_VIEW); }
  document.getElementById('btn-home').addEventListener('click', homeView);
  document.getElementById('btn-fs').addEventListener('click', function() {
    var p = document.getElementById('map-panel');
    if (document.fullscreenElement) document.exitFullscreen();
    else if (p.requestFullscreen) p.requestFullscreen();
  });

  /* ===== 点击散点 → 详情卡 ===== */
  map.on('click', function(p) {
    if (!p.data || !p.data.row) return;
    var r = p.data.row, e = S.esc;
    document.getElementById('dc-name').textContent = r[0];
    document.getElementById('dc-sub').textContent = S.cnCountry(r[2]) + ' · ' + r[3] + ' · 机组 ' + r[1];
    var stColor = S.STATUS_COLOR[r[4]] || '#9aa3b2';
    document.getElementById('dc-grid').innerHTML =
      '<div class="k">状态</div><div class="v"><span class="badge" style="background:' + stColor + '1f;color:' + stColor + '">' + r[4] + '</span></div>' +
      '<div class="k">容量</div><div class="v">' + r[6].toLocaleString() + ' MW</div>' +
      '<div class="k">燃料</div><div class="v">' + e(r[5]) + '</div>' +
      '<div class="k">投运年份</div><div class="v">' + (r[9] || '—') + '</div>' +
      '<div class="k">业主</div><div class="v" style="font-family:inherit">' + (r[10] ? e(r[10]) : '—') + '</div>' +
      '<div class="k">坐标</div><div class="v">' + (+r[7]).toFixed(2) + ', ' + (+r[8]).toFixed(2) + '</div>';
    var link = document.getElementById('dc-link');
    if (r[11]) { link.href = r[11]; link.style.display = 'inline-block'; }
    else link.style.display = 'none';
    document.getElementById('detail-card').classList.add('show');
  });
  document.getElementById('dc-close').addEventListener('click', function() {
    document.getElementById('detail-card').classList.remove('show');
  });

  /* ===== 搜索定位 ===== */
  var sugEl = document.getElementById('cty-sug'), qEl = document.getElementById('cty-search');
  function sugMatches(q) {
    q = q.trim().toLowerCase();
    if (!q) return [];
    var out = [];
    Object.keys(CTY).forEach(function(en) {
      var c = CTY[en];
      if (en.toLowerCase().indexOf(q) >= 0 || c.cn.toLowerCase().indexOf(q) >= 0) out.push(c);
    });
    out.sort(function(a, b) { return b.units - a.units; });
    return out.slice(0, 8);
  }
  qEl.addEventListener('input', function() {
    var ms = sugMatches(qEl.value);
    if (!ms.length) { sugEl.classList.remove('show'); return; }
    sugEl.innerHTML = ms.map(function(c, i) {
      return '<div class="sg-item' + (i === 0 ? ' sel' : '') + '" data-en="' + S.esc(c.en) + '"><span>' + S.esc(c.cn) + ' <span style="color:var(--faint);font-size:0.74rem">' + S.esc(c.en) + '</span></span><span class="sg-n">' + c.units.toLocaleString() + ' 台</span></div>';
    }).join('');
    sugEl.classList.add('show');
    Array.prototype.forEach.call(sugEl.querySelectorAll('.sg-item'), function(el) {
      el.addEventListener('mousedown', function(ev) { ev.preventDefault(); pickCty(el.getAttribute('data-en')); });
    });
  });
  qEl.addEventListener('keydown', function(e) {
    if (e.key !== 'Enter') return;
    var sel = sugEl.querySelector('.sg-item.sel');
    if (sel) pickCty(sel.getAttribute('data-en'));
  });
  qEl.addEventListener('blur', function() { setTimeout(function() { sugEl.classList.remove('show'); }, 180); });
  function pickCty(en) {
    state.country = en;
    qEl.value = CTY[en] ? CTY[en].cn : en;
    sugEl.classList.remove('show');
    applyFilter();
    var v = ctyView(en);
    if (v) flyTo(v);
  }

  /* ===== 徽标 + URL 同步 + 主流程 ===== */
  function renderBadge() {
    var cap = 0;
    filtered.forEach(function(r) { cap += r[6]; });
    document.getElementById('map-badge').textContent =
      filtered.length.toLocaleString() + ' 台机组 · ' + (cap / 1000).toFixed(1) + ' GW';
  }
  function syncUrl() {
    var q = new URLSearchParams();
    if (state.statuses.length && state.statuses.length !== S.STATUS_ORDER.length) q.set('status', state.statuses.join(','));
    if (state.regions.length && state.regions.length !== REGION_ITEMS.length) q.set('region', state.regions.join(','));
    if (state.fuels.length && state.fuels.length !== FUEL_ITEMS.length) q.set('fuel', state.fuels.join(','));
    if (state.country) q.set('country', state.country);
    var s = q.toString();
    history.replaceState(null, '', s ? '?' + s : location.pathname);
  }
  function applyFilter() {
    filtered = RAW.filter(function(r) {
      if (state.statuses.length && state.statuses.indexOf(r[4]) < 0) return false;
      if (state.regions.length && state.regions.indexOf(r[3]) < 0) return false;
      if (state.fuels.length && state.fuels.indexOf(r[5]) < 0) return false;
      if (state.country && r[2] !== state.country) return false;
      if (state.yearMin && (!r[9] || r[9] < state.yearMin)) return false;
      if (state.yearMax && (!r[9] || r[9] > state.yearMax)) return false;
      return true;
    });
    renderMap(); renderBadge(); syncUrl();
  }
  /* ===== AI 功能（Kimi） ===== */
  var AI = window.KIMI;
  var aiNoteEl = document.getElementById('ai-note');
  function showAiNote(html) { aiNoteEl.innerHTML = html; aiNoteEl.classList.add('show'); }
  function hideAiNote() { aiNoteEl.classList.remove('show'); }

  /* --- ① 问数据：自然语言 → 筛选条件 --- */
  var NL_SYS =
    '你是全球油气电厂数据库的筛选助手。数据库每台机组有以下可筛选维度：\n' +
    '- status（状态），只能取：' + S.STATUS_ORDER.join('、') + '\n' +
    '- region（大区），只能取：' + REGION_ITEMS.map(function(i) { return i.v; }).join('、') + '\n' +
    '- fuel（燃料），只能取：' + FUEL_ITEMS.map(function(i) { return i.v; }).join('、') + '\n' +
    '- country（国家，英文名，如 China、Japan、United States）\n' +
    '- 投运年份 yearMin / yearMax（整数年份）\n' +
    '用户用中文描述想看的机组，你把它翻译成筛选条件，只输出一个 JSON 对象，不要输出其他任何文字：\n' +
    '{"statuses":[],"regions":[],"fuels":[],"country":"","yearMin":0,"yearMax":0,"note":"用一句中文说明你的理解"}\n' +
    '规则：数组为空表示该维度不限制；yearMin/yearMax 为 0 表示不限；country 必须是英文名，不确定就留空；' +
    '「新建/开发中」通常指 在建、前期开发、已宣布 三种状态；「老机组」等无法用现有维度表达的条件在 note 里说明，不要编造字段。';

  var aiAsking = false;
  function aiAsk() {
    var q = document.getElementById('ai-q').value.trim();
    if (!q) { AI.toast('先输入想查的内容'); return; }
    if (aiAsking) return;
    aiAsking = true;
    var btn = document.getElementById('ai-ask');
    btn.disabled = true; btn.textContent = '思考中…';
    AI.chat(NL_SYS, q, { temperature: 0.1, max_tokens: 400 }, function(err, text) {
      aiAsking = false; btn.disabled = false; btn.textContent = '问数据';
      if (err) { showAiNote('<b>出错了：</b>' + S.esc(err.message)); return; }
      var j = AI.extractJSON(text);
      if (!j) { showAiNote('<b>没看懂 AI 的回答，请换个说法再试。'); return; }
      var ok = function(v, arr) { return arr.indexOf(v) >= 0; };
      state.statuses = (j.statuses || []).filter(function(v) { return ok(v, S.STATUS_ORDER); });
      state.regions = (j.regions || []).filter(function(v) { return ok(v, REGION_ITEMS.map(function(i) { return i.v; })); });
      state.fuels = (j.fuels || []).filter(function(v) { return ok(v, FUEL_ITEMS.map(function(i) { return i.v; })); });
      state.yearMin = (+j.yearMin) || 0;
      state.yearMax = (+j.yearMax) || 0;
      state.country = '';
      if (j.country) {
        var want = String(j.country).toLowerCase();
        Object.keys(CTY).forEach(function(en) {
          if (en.toLowerCase() === want || S.cnCountry(en) === j.country) state.country = en;
        });
      }
      mStatus.set(state.statuses); mRegion.set(state.regions); mFuel.set(state.fuels);
      document.getElementById('cty-search').value = state.country ? (CTY[state.country] ? CTY[state.country].cn : state.country) : '';
      applyFilter();
      if (state.country) { var v = ctyView(state.country); if (v) flyTo(v); }
      var cap = 0; filtered.forEach(function(r) { cap += r[6]; });
      var parts = [];
      if (state.statuses.length) parts.push('状态=' + state.statuses.join('/'));
      if (state.regions.length) parts.push('大区=' + state.regions.join('/'));
      if (state.fuels.length) parts.push('燃料=' + state.fuels.join('/'));
      if (state.country) parts.push('国家=' + S.cnCountry(state.country));
      if (state.yearMin || state.yearMax) parts.push('投运=' + (state.yearMin || '…') + '~' + (state.yearMax || '…'));
      showAiNote('<b>✦ ' + S.esc(j.note || '已按你的描述筛选') + '</b>　' +
        (parts.length ? S.esc(parts.join('，')) : '未加限制（全量）') +
        '　→　<b>' + filtered.length.toLocaleString() + '</b> 台机组 · ' + (cap / 1000).toFixed(1) + ' GW');
    });
  }
  document.getElementById('ai-ask').addEventListener('click', aiAsk);
  document.getElementById('ai-q').addEventListener('keydown', function(e) { if (e.key === 'Enter') aiAsk(); });

  /* --- ② AI 解读当前视图 --- */
  function filteredStats() {
    var cap = 0, byStatus = {}, byRegion = {}, byFuel = {}, byCty = {}, plants = {};
    filtered.forEach(function(r) {
      cap += r[6];
      var st = byStatus[r[4]] || (byStatus[r[4]] = { u: 0, c: 0 }); st.u++; st.c += r[6];
      var rg = byRegion[r[3]] || (byRegion[r[3]] = { u: 0, c: 0 }); rg.u++; rg.c += r[6];
      var f = byFuel[r[5]] || (byFuel[r[5]] = { u: 0, c: 0 }); f.u++; f.c += r[6];
      var ct = byCty[r[2]] || (byCty[r[2]] = { u: 0, c: 0 }); ct.u++; ct.c += r[6];
      plants[r[0]] = 1;
    });
    function top(obj, n, cn) {
      return Object.keys(obj).map(function(k) { return { k: cn ? S.cnCountry(k) : k, u: obj[k].u, g: +(obj[k].c / 1000).toFixed(1) }; })
        .sort(function(a, b) { return b.g - a.g; }).slice(0, n);
    }
    return {
      units: filtered.length, plants: Object.keys(plants).length, capGW: +(cap / 1000).toFixed(1),
      byStatus: top(byStatus, 8), byRegion: top(byRegion, 6), byFuel: top(byFuel, 5), topCountries: top(byCty, 10, true)
    };
  }
  function currentFilterDesc() {
    var d = [];
    if (state.statuses.length) d.push('状态=' + state.statuses.join('/'));
    if (state.regions.length) d.push('大区=' + state.regions.join('/'));
    if (state.fuels.length) d.push('燃料=' + state.fuels.join('/'));
    if (state.country) d.push('国家=' + S.cnCountry(state.country));
    if (state.yearMin || state.yearMax) d.push('投运年份=' + (state.yearMin || '…') + '~' + (state.yearMax || '…'));
    return d.length ? d.join('，') : '全量数据（无筛选）';
  }
  var READ_SYS =
    '你是能源行业分析师，熟悉全球油气发电格局。用户会给你一份全球油气电厂机组数据库某个筛选视图的统计摘要（JSON，容量单位 GW）。' +
    '请写 3 段中文解读（每段 2-3 句，总字数 ≤260 字）：第 1 段总体格局（规模、头部集中度），第 2 段结构特征（状态/燃料/区域的构成与含义），第 3 段一个值得关注的观察或趋势。' +
    '要求：基于给定数字说话，不编造数据之外的“事实”；可用 **加粗** 标记关键数字；直接输出正文段落，不要标题、不要列表、不要寒暄。';
  var aiReading = false;
  document.getElementById('ai-read').addEventListener('click', function() {
    if (aiReading) return;
    var panel = document.getElementById('ai-panel'), body = document.getElementById('ai-panel-body');
    panel.classList.add('show');
    body.innerHTML = '<span class="ai-dots"><i></i><i></i><i></i></span>';
    aiReading = true;
    var btn = document.getElementById('ai-read'); btn.disabled = true;
    var st = filteredStats();
    var userMsg = '筛选条件：' + currentFilterDesc() + '\n统计摘要：' + JSON.stringify(st);
    AI.chat(READ_SYS, userMsg, { temperature: 0.5, max_tokens: 900 }, function(err, text) {
      aiReading = false; btn.disabled = false;
      if (err) { body.innerHTML = '<p style="color:var(--c-cancelled)">出错了：' + S.esc(err.message) + '</p>'; return; }
      body.innerHTML = text.trim().split(/\n{2,}|\n/).filter(function(s) { return s.trim(); })
        .map(function(p) { return '<p>' + S.esc(p.trim()).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') + '</p>'; }).join('');
    });
  });
  document.getElementById('ai-panel-close').addEventListener('click', function() {
    document.getElementById('ai-panel').classList.remove('show');
  });

  applyFilter();
  if (state.country) {
    qEl.value = CTY[state.country] ? CTY[state.country].cn : state.country;
    var v0 = ctyView(state.country);
    if (v0) curView = { center: v0.center.slice(), zoom: v0.zoom };
    renderMap();
  }
})();
</script>
</body>
</html>
